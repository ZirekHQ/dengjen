sonar.projectKey=ZirekHQ_dengjen
sonar.organization=zirekhq

# SonarCloud has no Rust analyzer, so crates/** isn't scanned here -- Rust checks (clippy,
# cargo audit) live in rust-lint.yaml instead. This only covers what Sonar can analyse:
# Python bindings, Go/Java bindings, the runnable examples, and the workflow files themselves.
#
# bindings/java splits sonar.sources/sonar.tests: lumping tests into sources made Sonar
# demand coverage of the test methods themselves (nothing calls them, so JaCoCo reports 0%),
# dragging new_coverage down independent of production-code coverage. dengjen_test.go hits
# the same issue -- `go test -coverprofile` never instruments a _test.go file, so it needs
# the sonar.exclusions/sonar.tests split below instead of a directory-level one.
sonar.sources=crates/frontends/python/python,examples,bindings/go,bindings/java/src/main,.github/workflows
sonar.exclusions=bindings/go/dengjen_test.go
sonar.tests=bindings/java/src/test,bindings/java/src/integrationTest,bindings/java/src/e2e,bindings/java/src/nativeLoaderTest,bindings/go/dengjen_test.go,crates/frontends/python/tests

# examples/ holds runnable demos, not tests -- they shouldn't gate coverage, but reclassifying
# them as sonar.tests would apply test-only rule profiles to them, so exclude them from coverage
# specifically instead. The pydengjen package sources are excluded too: their tests run against
# the built wheel in a separate process, so no coverage report maps back to these files.
sonar.coverage.exclusions=examples/**,crates/frontends/python/python/**

sonar.python.version=3.7
sonar.sourceEncoding=UTF-8

# Generated by .github/workflows/sonar.yaml before the scan step runs (jacocoTestReport merges
# test/integrationTest/e2e into one XML; `go test -coverprofile` writes the Go one directly).
sonar.coverage.jacoco.xmlReportPaths=bindings/java/build/reports/jacoco/test/jacocoTestReport.xml
sonar.go.coverage.reportPaths=bindings/go/coverage.out

# Without these the Java analyzer falls back to syntax-only checks; `make coverage` already
# produces the classes, and $HOME jars resolve via the scanner's ${env.*} (no other access here).
# nativeLoaderTest is deliberately excluded -- make coverage's jacocoTestReport never compiles it.
sonar.java.binaries=bindings/java/build/classes/java/main
sonar.java.libraries=${env.HOME}/.gradle/caches/modules-2/files-2.1/**/*.jar
sonar.java.test.binaries=bindings/java/build/classes/java/test,bindings/java/build/classes/java/integrationTest,bindings/java/build/classes/java/e2e
sonar.java.test.libraries=${env.HOME}/.gradle/caches/modules-2/files-2.1/**/*.jar
