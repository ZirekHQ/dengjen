name: Publish to crates.io

# Called as a job of release.yaml's flow, which is gated upstream (PR merge for the normal path,
# prepare-release.yaml's `gate` job for the override path) -- this file has none of its own. Not
# tag-triggered itself, so a stray tag push can't fire a real publish.
on:
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # Requires crates.io Trusted Publishing configured for all 13 crates, targeting BOTH
      # release.yaml and prepare-release.yaml (crates.io matches the JWT's top-level triggering
      # workflow, not this reusable file, even though id-token: write lives here).

      # github.workflow_ref stays bound to the top-level caller through nested workflow_call hops
      # too -- release.yaml (always @refs/heads/main, its only trigger) or prepare-release.yaml (the
      # override path, which can legitimately run from a tag ref -- see the stale-retry path).
      - name: verify OIDC workflow_ref matches crates.io Trusted Publishing target
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          actual_path="${WORKFLOW_REF%@*}"
          matched=false
          for repo in ZirekHQ/dengjen-tts ZirekHQ/dengjen; do
            if [ "$WORKFLOW_REF" = "${repo}/.github/workflows/release.yaml@refs/heads/main" ] \
              || [ "$actual_path" = "${repo}/.github/workflows/prepare-release.yaml" ]; then
              matched=true
            fi
          done
          if [ "$matched" != true ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected release.yaml@refs/heads/main or prepare-release.yaml@<any ref> in ZirekHQ/dengjen-tts or ZirekHQ/dengjen. crates.io Trusted Publishing for all 13 crates must target both release.yaml and prepare-release.yaml -- if either workflow was renamed, update crates.io's config and this check together." >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Resolve workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # `cargo publish --dry-run` per crate cannot resolve same-version workspace deps that are not
      # on crates.io yet (tier 2+ on a version bump). Packaging the whole workspace resolves them
      # from the local packages instead and builds each archive; publish-crate-if-needed.sh then
      # skips its per-crate dry run.
      - name: package and verify the workspace (dry run only)
        if: env.DRY_RUN == 'true'
        run: cargo package --workspace --locked

      # publish-crate-if-needed.sh skips a crate crates.io already has (a curl lookup, no token
      # needed) before CARGO_REGISTRY_TOKEN is read -- see the script's own comment for why.
      - name: publish tier 1 (dengjen-audio-ops, dengjen-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-audio-ops "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-core "$VERSION"
      - name: wait for tier 1 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-audio-ops "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-core "$VERSION"

      - name: publish tier 2 (dengjen-tts-core)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-core "$VERSION"
      - name: wait for tier 2 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tts-core "$VERSION"

      - name: publish tier 3 (dengjen-hebrew-phonemizer, dengjen-pinyin-phonemizer)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-hebrew-phonemizer "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-pinyin-phonemizer "$VERSION"
      - name: wait for tier 3 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-hebrew-phonemizer "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-pinyin-phonemizer "$VERSION"

      - name: publish tier 4 (dengjen-espeak-phonemizer)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-phonemizer "$VERSION"
      - name: wait for tier 4 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-espeak-phonemizer "$VERSION"

      - name: publish tier 5 (dengjen-tts-piper, dengjen-tts-kokoro, dengjen-tts-melotts)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-piper "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-kokoro "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-melotts "$VERSION"
      - name: wait for tier 5 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-tts-piper "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-kokoro "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-melotts "$VERSION"

      - name: publish tier 6 (dengjen-tts)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-tts "$VERSION"
      - name: wait for tier 6 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/wait-for-crate.sh dengjen-tts "$VERSION"

      - name: publish tier 7 (dengjen-tts-cli, dengjen-tts-grpc, dengjen-tts-python, libdengjen)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-cli "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-grpc "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh dengjen-tts-python "$VERSION"
          bash .github/scripts/publish-crate-if-needed.sh libdengjen "$VERSION"
      - name: wait for tier 7 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/wait-for-crate.sh dengjen-tts-cli "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-grpc "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-tts-python "$VERSION"
          bash .github/scripts/wait-for-crate.sh libdengjen "$VERSION"
