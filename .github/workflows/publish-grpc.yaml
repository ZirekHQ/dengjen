name: Publish gRPC server release

on:
  # Called as a job of release.yaml's flow. release.yaml has no gate of its own: the push-to-main
  # path is gated by the PR merge that triggers it, and the override path is gated by
  # prepare-release.yaml's own `gate` job before it ever calls release.yaml.
  workflow_call:
    inputs:
      tag:
        description: "grpc-release-vX.Y.Z to release"
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # github.workflow_ref stays bound to the top-level caller through nested workflow_call hops
      # too -- release.yaml (always @refs/heads/main) or prepare-release.yaml (the override path,
      # which can legitimately run from a stale-retry tag ref, not just main).
      - name: verify this workflow was only reached through release.yaml or prepare-release.yaml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          actual_path="${WORKFLOW_REF%@*}"
          matched=false
          for repo in ZirekHQ/dengjen-tts ZirekHQ/dengjen; do
            if [ "$WORKFLOW_REF" = "${repo}/.github/workflows/release.yaml@refs/heads/main" ] \
              || [ "$actual_path" = "${repo}/.github/workflows/prepare-release.yaml" ]; then
              matched=true
            fi
          done
          if [ "$matched" != true ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected release.yaml@refs/heads/main or prepare-release.yaml@<any ref> in ZirekHQ/dengjen-tts or ZirekHQ/dengjen -- refusing to run outside release.yaml's main-branch flow or prepare-release.yaml's override path" >&2
            exit 1
          fi
      - name: Check whether this version already has a GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          # `if resp=$(...)` (not a bare assignment) keeps a 404's non-zero exit from tripping this
          # step's implicit `bash -e`. Capture stdout only: gh api's stderr diagnostic would corrupt the JSON below.
          if resp="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")"; then
            echo "::notice::${RELEASE_TAG} already has a GitHub Release -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(printf '%s' "$resp" | jq -r '.status // empty' 2>/dev/null)"
          if [ "$status" = "404" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected error checking for an existing GitHub Release for ${RELEASE_TAG}: ${resp}" >&2
            exit 1
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: natives-*
          path: natives
      - name: extract target version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#grpc-release-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${RELEASE_TAG}' does not carry a valid vX.Y.Z suffix" >&2
            exit 1
          fi
          # dengjen-tts-grpc's own Cargo.toml has no literal version (it's `version.workspace = true`),
          # so this reads the root Cargo.toml instead.
          crate_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [[ "$version" != "v${crate_version}" ]]; then
            echo "Tag version '${version}' does not match workspace package version 'v${crate_version}'" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for name in linux-x64 macos-arm64; do
            chmod +x "natives/natives-${name}/dengjen-tts-grpc"
            tar -C "natives/natives-${name}" -czf "dist/dengjen-tts-grpc-${VERSION}-${name}.tar.gz" .
          done
          (cd natives/natives-windows-x64 && zip -qr "../../dist/dengjen-tts-grpc-${VERSION}-windows-x64.zip" .)
          ls -l dist
      - name: attest the release assets' build provenance
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # gh release create defaults an unset --target to the repo's default branch, not the
          # commit checked out -- pin it explicitly instead.
          RELEASE_SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN -- would create GitHub release ${RELEASE_TAG} with $(ls dist | wc -l) assets targeting ${RELEASE_SHA}, skipping"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$RELEASE_SHA" \
              --title "dengjen-tts-grpc ${RELEASE_VERSION}" \
              --notes ""
          fi
