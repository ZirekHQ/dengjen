name: Sonar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# SonarCloud keeps whichever report finishes processing last, not the newest
# commit, so overlapping scans can leave main showing an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Fork PRs are never given repository secrets, so SONAR_TOKEN would be empty
    # and the scan would fail with a red X the contributor cannot clear.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full history for new-code detection and blame
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler

      # Go/Java bindings compile against libdengjen; building it here is what lets their coverage
      # steps below produce real numbers instead of leaving sonar.coverage at 0% (channel comes
      # from rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      # The Java and Go recognizer tests need the assembled STT natives and a real model; without
      # them every Recognizer line reads as uncovered and new_coverage fails.
      - name: Build and assemble the STT natives
        run: |
          set -euo pipefail
          cargo build --release --locked -p libdengjen-stt
          stage="$RUNNER_TEMP/stt-stage"
          mkdir -p "$stage"
          cp -L target/release/liblibdengjen_stt.so "$stage/"
          cp -P target/sherpa-onnx-prebuilt/*/lib/* "$stage/"
          layout="$(bash scripts/ort-gate.sh "$stage/libonnxruntime.so" 27)"
          bash scripts/assemble-natives.sh linux "$layout" "$stage" "$RUNNER_TEMP/stt-native"
          echo "DENGJEN_STT_NATIVE_DIR=$RUNNER_TEMP/stt-native" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/stt-model
          key: stt-model-${{ hashFiles('.github/stt-smoke-model.json') }}
      - name: Fetch the recognition model
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary :all: huggingface_hub==0.34.4
          python3 - <<'PY'
          import json, os
          from huggingface_hub import snapshot_download
          spec = json.load(open(".github/stt-smoke-model.json"))
          path = snapshot_download(spec["repo"], allow_patterns=spec["files"], local_dir=os.environ["RUNNER_TEMP"] + "/stt-model")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DENGJEN_STT_MODEL_DIR={path}\nDENGJEN_STT_MODEL_SHA256={spec['sha256']}\n")
          PY
      - name: Java bindings coverage
        working-directory: bindings/java
        run: make coverage

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Go bindings coverage
        working-directory: bindings/go
        run: make coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
