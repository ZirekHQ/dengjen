name: CI

# Smoke-test only: builds the wheel matrix to catch build breakage on every push/PR, but never
# publishes. The real release build+publish lives in publish-python.yaml, invoked by release.yaml
# (single-trigger, single-gate) -- this file is never called by it and has no gate of its own.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        id: build-wheels-1
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: &build-wheels-args
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          manylinux: 2_28
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
          before-script-linux: |
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update -y && apt-get install -y clang libclang-dev llvm-dev
            elif command -v apk &> /dev/null; then
              apk add clang-dev llvm-dev
            fi
            # espeak-ng's build runs its own freshly cross-compiled binary to
            # generate data files; under qemu-user emulation it needs the
            # target sysroot to resolve its dynamic loader.
            sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
            if [ -d "$sysroot" ]; then
              export QEMU_LD_PREFIX="$sysroot"
              # Without a target sysroot, dengjen-espeak-rs-sys's bindgen step falls back to host
              # (x86_64) headers, which fail parsing aarch64 glibc multiarch headers.
              export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--sysroot=$sysroot"
            fi
      # maturin-action's fetch of its maturin binary occasionally truncates and isn't its own
      # step to retry individually, so the whole build retries with a back-off sleep between attempts.
      - name: Wait before retry 1
        if: steps.build-wheels-1.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 1)
        id: build-wheels-2
        if: steps.build-wheels-1.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 2
        if: steps.build-wheels-2.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 2)
        id: build-wheels-3
        if: steps.build-wheels-2.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 3
        if: steps.build-wheels-3.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 3)
        if: steps.build-wheels-3.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Test the x86_64 wheel
        if: matrix.platform.target == 'x86_64'
        run: |
          wheels=(crates/frontends/python/dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "expected exactly one wheel, found: ${wheels[*]}" >&2; exit 1; }
          python -m zipfile -e "${wheels[0]}" "$RUNNER_TEMP/wheel-test"
          PYTHONPATH="$RUNNER_TEMP/wheel-test" python -m unittest discover -s crates/frontends/python/tests -v
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: crates/frontends/python/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      matrix:
        platform:
          - runner: windows-2022
            target: x64
    steps:
      - name: install-clang
        run: choco install llvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.platform.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: crates/frontends/python/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
    steps:
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Test the wheel
        run: |
          wheels=(crates/frontends/python/dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "expected exactly one wheel, found: ${wheels[*]}" >&2; exit 1; }
          python -m zipfile -e "${wheels[0]}" "$RUNNER_TEMP/wheel-test"
          PYTHONPATH="$RUNNER_TEMP/wheel-test" python -m unittest discover -s crates/frontends/python/tests -v
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: crates/frontends/python/dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ./crates/frontends/python
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: crates/frontends/python/dist

  go-module-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - run: bash scripts/test-go-module-path.sh v1.2.3 v2.0.0 v3.0.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev espeak-ng protobuf-compiler
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo test (workspace, excluding dengjen-espeak-phonemizer, dengjen-tts, and dengjen-tts-kokoro)
        run: cargo test --workspace --exclude dengjen-espeak-phonemizer --exclude dengjen-tts --exclude dengjen-tts-kokoro --no-fail-fast
      # The C API build scripts rewrite their headers from cbindgen.toml; fail if one differs from
      # the committed copy.
      - name: C headers match the committed copies
        run: git diff --exit-code -- crates/frontends/capi/libdengjen.h crates/frontends/capi-stt/libdengjen_stt.h
      - name: cargo test (dengjen-espeak-phonemizer, single-threaded)
        run: cargo test -p dengjen-espeak-phonemizer -- --test-threads=1
      - name: cargo test (dengjen-tts-piper, hebrew and pinyin features enabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features espeak,tashkeel,hebrew,pinyin
      - name: cargo test (dengjen-tts-piper, espeak feature disabled)
        run: cargo test -p dengjen-tts-piper --no-default-features --features tashkeel
      - name: cargo test (dengjen-tts-kokoro, espeak feature enabled)
        run: cargo test -p dengjen-tts-kokoro --features espeak
      - name: cargo test (dengjen-tts-kokoro, espeak feature disabled)
        run: cargo test -p dengjen-tts-kokoro --no-default-features

  native-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test-ort-gate.sh
      - run: bash scripts/test-assemble-natives.sh

  # The three-OS natives build is slow, so a pull request runs it only when something it packages
  # or the scripts it runs changed; pushes to main and manual runs always do.
  natives-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      natives: ${{ steps.diff.outputs.natives }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did anything the natives package change?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "natives=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(scripts/(ort|assemble-natives|test-ort|test-assemble|smoke|check-imported|stage-python)|crates/stt/|crates/frontends/(capi-stt|grpc)/|\.github/workflows/assemble-natives\.yaml|\.github/stt-smoke-model\.json|Cargo\.lock)'
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE "$pattern"; then
            echo "natives=true" >> "$GITHUB_OUTPUT"
          else
            echo "natives=false" >> "$GITHUB_OUTPUT"
          fi

  natives:
    needs: natives-changes
    if: needs.natives-changes.outputs.natives == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/assemble-natives.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
