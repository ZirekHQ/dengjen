name: Proto Breaking

# Own workflow so adding or removing the `buf skip breaking` label re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Changes `buf breaking` (FILE rules) flags, such as removing or renumbering a field or
      # RPC, can break deployed clients or generated code; add the `buf skip breaking` label to
      # a PR that does this on purpose.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: crates/frontends/grpc/proto
          lint: false
          format: false
          pr_comment: false
          breaking_against: ".git#ref=refs/remotes/origin/${{ github.base_ref }},subdir=crates/frontends/grpc/proto"
