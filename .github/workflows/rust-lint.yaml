name: Rust Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, not per-PR: real-voice-e2e (below) downloads real model weights, too slow/costly
    # to run on every push.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      # channel + clippy/rustfmt components come from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - run: cargo install clippy-sarif sarif-fmt --locked
      - name: cargo clippy
        # SonarCloud has no Rust analyzer, so nothing else uploads SARIF for these crates --
        # this pipes clippy's JSON through clippy-sarif instead of standing up CodeQL.
        run: |
          set -o pipefail
          cargo clippy --workspace --lib --bins --benches --message-format=json -- -D warnings \
            | clippy-sarif | tee clippy-results.sarif | sarif-fmt
      - name: cargo clippy (dengjen-tts-kokoro, japanese feature)
        run: cargo clippy -p dengjen-tts-kokoro --features japanese --lib -- -D warnings
      - name: upload clippy SARIF
        # Fork and Dependabot PRs get a read-only token, which the SARIF upload rejects.
        if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: clippy-results.sarif

  semver-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      # cargo-semver-checks builds each baseline from the registry or a git rev without our
      # Cargo.lock, so a release whose manifests allow ort ^2.0.0-rc.13 resolves rc.14 and no
      # longer compiles. Build the latest tag from a worktree with ort pinned instead.
      # Releases that already carry the pin make the sed a no-op.
      - name: prepare pinned baseline
        id: baseline
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          git worktree add "$RUNNER_TEMP/baseline" "$tag"
          find "$RUNNER_TEMP/baseline" -name Cargo.toml -not -path '*/target/*' \
            -exec sed -i 's/^version = "2\.0\.0-rc\.13"/version = "=2.0.0-rc.13"/' {} +
          echo "root=$RUNNER_TEMP/baseline" >> "$GITHUB_OUTPUT"
      - name: cargo semver-checks
        # Only the crates with a meaningful public Rust API (rlib targets) are checked --
        # dengjen-tts-cli (bin-only), dengjen-tts-grpc (bin-only), and dengjen-tts-python /
        # libdengjen (cdylib/staticlib-only) have no rlib target for semver-checks to diff.
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          rust-toolchain: manual
          baseline-root: ${{ steps.baseline.outputs.root }}
          package: dengjen-audio-ops,dengjen-tts-core,dengjen-hebrew-phonemizer,dengjen-pinyin-phonemizer,dengjen-espeak-phonemizer,dengjen-tts-piper,dengjen-tts-kokoro,dengjen-tts-melotts,dengjen-tts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # paste is unmaintained (transitive via tokenizers -> pinyin-phonemizer; no
          # direct usage here). Upstream declined to migrate to a maintained fork:
          # https://github.com/huggingface/tokenizers/issues/1833
          # bincode is unmaintained (transitive via jpreprocess, optional `japanese`
          # feature); upstream replacement is open:
          # https://github.com/jpreprocess/jpreprocess/issues/497
          # zip 2.x (RUSTSEC-2026-0367/0368/0369) is a build-dependency of sherpa-onnx-sys 1.13.8 that
          # unpacks its own prebuilt download; drop these when #410 bumps to a release using zip 9.
          ignore: RUSTSEC-2024-0436,RUSTSEC-2025-0141,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # channel + clippy/rustfmt components come from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses/bans/sources are cheap and don't need a full build. Advisories are also
          # covered by the separate `rustsec/audit-check` job above (kept as belt-and-braces).
          command: check licenses bans sources

  hakari:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-hakari
      - name: cargo hakari generate --diff
        # Fails if crates/workspace-hack/Cargo.toml is stale -- a contributor forgot to run
        # `cargo hakari generate` after changing a dependency or feature flag.
        run: cargo hakari generate --diff

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$msrv" ]; then
            echo "Could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: cargo check (MSRV, default features)
        run: cargo check --workspace --locked
      - name: cargo check (MSRV, all features)
        run: cargo check --workspace --locked --all-features

  # Miri can't run this workspace's unsafe code -- every unsafe block calls into real linked C
  # libraries (onnxruntime, espeak-ng), and Miri doesn't support arbitrary FFI.
  # AddressSanitizer does, and is validated locally clean against libdengjen and dengjen-tts.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler espeak-ng
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo test under AddressSanitizer (libdengjen, dengjen-tts)
        env:
          RUSTFLAGS: -Z sanitizer=address
        # test_lazy_stream/test_parallel_stream/test_realtime_stream need real model fixtures not
        # present in CI (same reason CI.yaml's test job excludes dengjen-tts entirely) -- everything
        # else in the same binary, including synthetic-model tests, still runs.
        run: cargo +nightly test -p libdengjen -p dengjen-tts -Zbuild-std --target x86_64-unknown-linux-gnu -- --skip test_lazy_stream --skip test_parallel_stream --skip test_realtime_stream
      - name: cargo test under AddressSanitizer (dengjen-espeak-phonemizer, single-threaded)
        env:
          RUSTFLAGS: -Z sanitizer=address
          # See .github/asan-suppressions/lsan.txt: espeak-ng's own SetVoiceByName leaks a
          # small voice-table allocation on every voice switch. Vendored upstream C, not ours.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/asan-suppressions/lsan.txt
        run: cargo +nightly test -p dengjen-espeak-phonemizer -Zbuild-std --target x86_64-unknown-linux-gnu -- --test-threads=1

  # Build-only smoke check so fuzz targets don't bit-rot -- see CONTRIBUTING.md#fuzzing for why
  # actual fuzzing isn't run here and how to run a target manually.
  fuzz-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - run: cargo install cargo-fuzz --locked
      - name: cargo fuzz build (map_phonemes_to_ids)
        working-directory: crates/dengjen/models/piper
        run: cargo +nightly fuzz build
      - name: cargo fuzz build (normalize_numbers)
        working-directory: crates/text/pinyin-phonemizer
        run: cargo +nightly fuzz build
      - name: cargo fuzz build (num_classes)
        working-directory: crates/text/hebrew-phonemizer
        run: cargo +nightly fuzz build
      - name: cargo fuzz build (text_to_phonemes)
        working-directory: crates/text/espeak-phonemizer
        run: cargo +nightly fuzz build

  # audio/ops's bench is self-contained (synthetic samples) so it runs for real here. synth's
  # divan benches need real voice fixtures and run, compared against the merge base, in
  # synth-bench.yaml -- see CONTRIBUTING.md#benchmarks.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: cargo bench (audio-ops)
        working-directory: crates/audio/ops
        run: |
          {
            echo '### audio/ops benchmarks'
            echo '```'
            cargo bench --bench benchmarks
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Mirrors CI.yaml's `test` job's per-crate invocations under cargo-llvm-cov instrumentation.
  # SonarCloud doesn't scan crates/** (see sonar-project.properties), so this reports coverage
  # to GitHub's own feature instead.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      code-quality: write
    steps:
      # actions/checkout defaults to the synthetic merge commit for pull_request events, but
      # GitHub's code coverage upload (below) annotates the PR's file-diff against the head
      # commit -- checking out the merge commit would leave the upload lining up with nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev espeak-ng protobuf-compiler
      # llvm-tools-preview adds to rust-toolchain.toml's channel + clippy/rustfmt components.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: cargo llvm-cov (workspace, excluding dengjen-espeak-phonemizer, dengjen-tts, and dengjen-tts-kokoro)
        run: cargo llvm-cov --no-report --workspace --exclude dengjen-espeak-phonemizer --exclude dengjen-tts --exclude dengjen-tts-kokoro --no-fail-fast
      - name: cargo llvm-cov (dengjen-espeak-phonemizer, single-threaded)
        run: cargo llvm-cov --no-report -p dengjen-espeak-phonemizer -- --test-threads=1
      - name: cargo llvm-cov (dengjen-tts-piper, hebrew and pinyin features enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-piper --no-default-features --features espeak,tashkeel,hebrew,pinyin
      - name: cargo llvm-cov (dengjen-tts-piper, espeak feature disabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-piper --no-default-features --features tashkeel
      - name: cargo llvm-cov (dengjen-tts-kokoro, espeak feature enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-kokoro --features espeak
      - name: cargo llvm-cov (dengjen-tts-kokoro, espeak and japanese features enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-kokoro --features espeak,japanese
      - name: cargo llvm-cov (dengjen-tts-kokoro, espeak feature disabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-kokoro --no-default-features
      - name: cargo llvm-cov (dengjen-tts-melotts, espeak and pinyin features enabled)
        run: cargo llvm-cov --no-report -p dengjen-tts-melotts --features espeak,pinyin
      - name: merge coverage into a Cobertura report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: upload coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: cobertura.xml
          language: Rust

  # Real voices come from the sha256-pinned release assets in .github/bench-fixtures.json, the
  # same fixtures synth-bench.yaml uses.
  kokoro-real-voice-e2e:
    needs: changes
    # always() so a skipped `changes` (schedule, dispatch) does not skip this job.
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev espeak-ng
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: read fixture manifest
        id: manifest
        run: |
          {
            echo "piper_sha=$(jq -r '.fixtures[] | select(.name=="piper-std") | .sha256' .github/bench-fixtures.json)"
            echo "kokoro_sha=$(jq -r '.fixtures[] | select(.name=="kokoro") | .sha256' .github/bench-fixtures.json)"
          } >> "$GITHUB_OUTPUT"
      # Same key and path as synth-bench.yaml, which saves it on main, so PRs rarely download.
      - name: restore Kokoro fixture
        id: kokoro-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/dengjen/synth/models/kokoro
          key: bench-fixture-kokoro-${{ steps.manifest.outputs.kokoro_sha }}
      - name: fetch real Kokoro voice fixture
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-manifest-fixtures.sh .github/bench-fixtures.json . kokoro
      - name: point the tests at the Kokoro voice
        run: |
          voice_dir="$PWD/crates/dengjen/synth/models/kokoro"
          echo "DENGJEN_KOKORO_TEST_VOICE_CONFIG=${voice_dir}/config.json" >> "$GITHUB_ENV"
          vocab="$(jq -r '.vocab_path' "${voice_dir}/config.json")"
          echo "DENGJEN_KOKORO_VOCAB=${voice_dir}/${vocab}" >> "$GITHUB_ENV"
      - name: cargo test (dengjen-tts-kokoro, real voice e2e)
        run: cargo test -p dengjen-tts-kokoro --features espeak --test e2e_real_voice
      - name: cargo test (dengjen-tts-cli, kokoro real voice e2e)
        run: cargo test -p dengjen-tts-cli --test kokoro_e2e
      # The test returns early unless DENGJEN_KOKORO_VOCAB is set, so only this step exercises it.
      - name: cargo test (dengjen-tts-kokoro, Japanese table symbols exist in the real vocab)
        run: cargo test -p dengjen-tts-kokoro --features japanese --lib every_table_symbol_exists_in_the_kokoro_vocab

  # Real Piper voice from the pinned release asset; the benches live in synth-bench.yaml.
  piper-real-voice-e2e:
    needs: changes
    # always() so a skipped `changes` (schedule, dispatch) does not skip this job.
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev espeak-ng
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: locate espeak-ng-data directory
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          if [ -z "$data_dir" ] || [ "$data_dir" = "." ]; then
            echo "Could not locate an espeak-ng-data directory" >&2
            exit 1
          fi
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: read fixture manifest
        id: manifest
        run: echo "piper_sha=$(jq -r '.fixtures[] | select(.name=="piper-std") | .sha256' .github/bench-fixtures.json)" >> "$GITHUB_OUTPUT"
      - name: restore Piper std fixture
        id: piper-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/dengjen/synth/models/std
          key: bench-fixture-piper-std-${{ steps.manifest.outputs.piper_sha }}
      - name: fetch real Piper std voice fixture
        if: steps.piper-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-manifest-fixtures.sh .github/bench-fixtures.json . piper-std
      # `rt` has no upstream export, so its archive is operator-provided and must carry a hash.
      - name: download real Piper rt voice fixture
        if: vars.PIPER_RT_TEST_VOICE_ARCHIVE_URL != '' && vars.PIPER_RT_TEST_VOICE_ARCHIVE_SHA256 != ''
        run: |
          mkdir -p crates/dengjen/synth/models/rt
          curl -fsSL "${VARS_PIPER_RT_TEST_VOICE_ARCHIVE_URL}" -o /tmp/piper-rt-voice.tar.gz
          echo "${VARS_PIPER_RT_TEST_VOICE_ARCHIVE_SHA256}  /tmp/piper-rt-voice.tar.gz" | sha256sum -c -
          tar -xzf /tmp/piper-rt-voice.tar.gz -C crates/dengjen/synth/models/rt
        env:
          VARS_PIPER_RT_TEST_VOICE_ARCHIVE_URL: ${{ vars.PIPER_RT_TEST_VOICE_ARCHIVE_URL }}
          VARS_PIPER_RT_TEST_VOICE_ARCHIVE_SHA256: ${{ vars.PIPER_RT_TEST_VOICE_ARCHIVE_SHA256 }}
      - name: cargo test (dengjen-tts, real Piper voice streams)
        run: cargo test -p dengjen-tts --test tests -- test_lazy_stream test_parallel_stream test_realtime_stream

  # libdengjen (crates/frontends/capi) depends on nearly the whole crate graph, so this
  # filters on all of crates/** rather than a narrow subset -- a hand-picked shorter list
  # would risk silently skipping a rebuild a real dependency change needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      java: ${{ steps.filter.outputs.java }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # dorny/paths-filter's token mode only skips checkout for pull_request events -- push
      # events still diff via git and need a checked-out repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            java:
              - 'crates/**'
              - 'bindings/java/**'
              - 'Cargo.lock'
            e2e:
              - 'crates/dengjen/**'
              - 'crates/text/**'
              - 'crates/audio/**'
              - 'crates/frontends/cli/**'
              - 'crates/workspace-hack/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/rust-lint.yaml'
              - '.github/bench-fixtures.json'
              - '.github/scripts/fetch-*.sh'

  bindings-java:
    needs: changes
    # always() so this still runs when `changes` is legitimately skipped (workflow_dispatch,
    # schedule -- no base ref to diff against, so always run unfiltered there).
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.java == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed so git-versioning's `git describe` can find the java-v* tag; shallow clones have no tags
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install onnxruntime
        # The published natives load onnxruntime dynamically (ort-dylib), so test that build.
        run: |
          pip install --only-binary ':all:' onnxruntime==1.30.0
          lib="$(python3 -c 'import glob, os, onnxruntime; print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), "capi", "libonnxruntime.so*"))[0])')"
          echo "ORT_DYLIB_PATH=${lib}" >> "$GITHUB_ENV"
      - name: Check the natives fingerprint
        # A native change must refresh bindings/java/natives.fingerprint and bump nativesVersion.
        run: scripts/natives-fingerprint.sh --check
      - name: Check nativesVersion was bumped with the fingerprint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/natives-fingerprint.sh --check-bump "origin/${BASE_REF}"
      - name: Check the STT natives fingerprint
        # A change to crates/stt, libdengjen-stt or the sherpa-onnx pin must refresh
        # bindings/java/stt-natives.fingerprint and bump sttNativesVersion.
        env:
          NATIVES_KIND: stt
        run: scripts/natives-fingerprint.sh --check
      - name: Check sttNativesVersion was bumped with the fingerprint
        if: github.event_name == 'pull_request'
        env:
          NATIVES_KIND: stt
          BASE_REF: ${{ github.base_ref }}
        run: scripts/natives-fingerprint.sh --check-bump "origin/${BASE_REF}"
      - name: make test
        working-directory: bindings/java
        env:
          CARGO_FEATURES: ort-dylib
        run: make test
      - name: make fmt-check
        working-directory: bindings/java
        run: make fmt-check

  bindings-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/refresh-sherpa-build # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: make test
        working-directory: bindings/go
        run: make test
      - name: make vet
        working-directory: bindings/go
        run: make vet
      - name: make test-stt
        working-directory: bindings/go
        run: make test-stt
      - name: make fmt-check
        working-directory: bindings/go
        run: make fmt-check
