name: Publish Python wheels

# Called as a job of release.yaml's flow. release.yaml has no gate of its own: the push-to-main
# path is gated by the PR merge that triggers it, and the override path is gated by
# prepare-release.yaml's own `gate` job before it ever calls release.yaml. Separate from CI.yaml's
# own build matrix, which smoke-tests on every push/PR but never publishes -- this file
# duplicates that matrix rather than sharing it, same split tashkeel already uses for its
# own python-wheel.yml (CI-only) vs python-publish.yml (release-only) pair.
#
# Build-only: PyPI Trusted Publishing is unsupported from a reusable workflow (see
# pypa/gh-action-pypi-publish's README), so the upload lives in the top-level release.yaml (push
# path) and prepare-release.yaml (override path), which download this file's `wheels-*` artifacts.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            maturin_features: --features stt
          - runner: ubuntu-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: llvm llvm-dev llvm-runtime libclang-dev
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Stage the eSpeak-ng data built from source
        run: bash scripts/stage-espeak-data.sh crates/frontends/python/python/pydengjen --release
      - name: Build wheels
        id: build-wheels-1
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: &build-wheels-args
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ matrix.platform.maturin_features }}
          working-directory: ./crates/frontends/python
          sccache: false
          manylinux: 2_28
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
          before-script-linux: |
            export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
            if command -v yum &> /dev/null; then
              yum install -y clang-devel llvm-devel
            elif command -v apt-get &> /dev/null; then
              apt-get update -y && apt-get install -y clang libclang-dev llvm-dev
            elif command -v apk &> /dev/null; then
              apk add clang-dev llvm-dev
            fi
            # espeak-ng's build runs its own freshly cross-compiled binary to
            # generate data files; under qemu-user emulation it needs the
            # target sysroot to resolve its dynamic loader.
            sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
            if [ -d "$sysroot" ]; then
              export QEMU_LD_PREFIX="$sysroot"
              # Without a target sysroot, dengjen-espeak-rs-sys's bindgen step falls back to host
              # (x86_64) headers, which fail parsing aarch64 glibc multiarch headers.
              export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu="--sysroot=$sysroot"
            fi
      # maturin-action's fetch of its maturin binary occasionally truncates and isn't its own
      # step to retry individually, so the whole build retries with a back-off sleep between attempts.
      - name: Wait before retry 1
        if: steps.build-wheels-1.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 1)
        id: build-wheels-2
        if: steps.build-wheels-1.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 2
        if: steps.build-wheels-2.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 2)
        id: build-wheels-3
        if: steps.build-wheels-2.outcome == 'failure'
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Wait before retry 3
        if: steps.build-wheels-3.outcome == 'failure'
        run: sleep 20
      - name: Build wheels (retry 3)
        if: steps.build-wheels-3.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: *build-wheels-args
      - name: Check wheel metadata
        run: |
          python3 -m pip install --quiet --only-binary :all: twine==6.1.0
          python3 -m twine check --strict crates/frontends/python/dist/*
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          # maturin-action's working-directory (above) is where --out dist actually lands --
          # not the workspace root upload-artifact resolves `path:` against by default.
          path: crates/frontends/python/dist
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      matrix:
        platform:
          - runner: windows-2022
            target: x64
            maturin_features: --features stt
    steps:
      - name: install-clang
        run: choco install llvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.platform.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natives-windows-x64
          path: natives
      - name: Stage the eSpeak-ng data built from source
        shell: bash
        run: bash scripts/stage-espeak-data.sh crates/frontends/python/python/pydengjen --release
      - name: Stage the speech recognition libraries
        shell: bash
        run: bash scripts/stage-python-stt-libs.sh natives
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ matrix.platform.maturin_features }}
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      # Python is pinned, not 3.x, so a floating interpreter can't change what the abi3-py39
      # wheel is tested against; it must load there with its bundled onnxruntime DLLs. Extracted
      # rather than pip-installed: Sonar S8544 flags any pip install that doesn't pin hashes.
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m zipfile -e crates/frontends/python/dist/*.whl smoke
          PYTHONPATH=smoke python -c "import pydengjen; assert hasattr(pydengjen, 'Recognizer')"
          test -f smoke/pydengjen/espeak-ng-data/phontab
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: crates/frontends/python/dist
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
            maturin_features: --features stt
    steps:
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: natives-macos-arm64
          path: natives
      - name: Stage the eSpeak-ng data built from source
        shell: bash
        run: bash scripts/stage-espeak-data.sh crates/frontends/python/python/pydengjen --release
      - name: Stage the speech recognition libraries
        shell: bash
        run: bash scripts/stage-python-stt-libs.sh natives
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ matrix.platform.maturin_features }}
          working-directory: ./crates/frontends/python
          sccache: false
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: crates/frontends/python/dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ./crates/frontends/python
          # Pinned so Renovate (see renovate.json) can bump it deliberately,
          # rather than the action re-resolving "latest" over the network
          # on every retry.
          maturin-version: v1.15.0
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: crates/frontends/python/dist
          if-no-files-found: error
