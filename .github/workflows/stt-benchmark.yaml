name: STT benchmark

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of test clips
        type: string
        default: "300"

permissions:
  contents: read

concurrency:
  group: stt-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark (${{ matrix.os }}, ${{ matrix.test_set }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test_set: [cv, kobani]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/stt/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-stt-${{ runner.os }}-${{ hashFiles('benchmarks/stt/models.json') }}
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r benchmarks/stt/requirements.txt
      - name: Score the models
        timeout-minutes: 180
        env:
          TEST_SET: ${{ matrix.test_set }}
          LIMIT: ${{ inputs.limit || '300' }}
        run: python benchmarks/stt/evaluate.py --set "$TEST_SET" --limit "$LIMIT" --out results.json
      - name: Summarise
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          rows = json.load(open("results.json"))
          print("| Model | WER % | CER % | Size MB | RTF (CPU) | Clips |")
          print("|---|---|---|---|---|---|")
          for r in rows:
              if "error" in r:
                  print(f"| {r['model']} | error | | | | |")
              else:
                  print(f"| {r['model']} | {r['wer']} | {r['cer']} | {r['size_mb']} | {r['rtf_cpu']} | {r['clips']} |")
          PY
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stt-benchmark-${{ matrix.os }}-${{ matrix.test_set }}
          path: results.json
