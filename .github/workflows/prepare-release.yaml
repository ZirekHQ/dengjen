name: Prepare release

# Single entry point for releases -- see `prepare` (normal path, opens a version-bump PR) and
# `gate`/`release-now` (override path, requires approval) below for the two paths.
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Skip the PR: release this exact vX.Y.Z tag directly (requires approval)"
        required: false
        type: string
      previous_tag:
        description: "Override Java changelog baseline (only used together with new_tag)"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing (only used together with new_tag)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Normal path: compute the next version and open the PR. Merging it is the release gate --
  # nothing here needs approval of its own. Skipped when new_tag selects the override path below.
  prepare:
    if: inputs.new_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
          # A PR pushed and opened with GITHUB_TOKEN triggers no pull_request workflows, so the
          # release PR would get no CI. RELEASE_PR_TOKEN (a PAT or App token) is optional.
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # `run:` steps execute as `bash -e {0}` regardless of `set` above -- a bare assignment
          # would abort here on next-version.sh's exit 1, before rc is ever inspected.
          if version="$(bash scripts/next-version.sh)"; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            current="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            if [ "$current" = "$version" ]; then
              echo "::warning::Cargo.toml is already at ${version}, so there is nothing to bump -- release it with new_tag=v${version}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        run: bash scripts/bump-version.sh "${STEPS_NEXT_OUTPUTS_VERSION}"
        env:
          STEPS_NEXT_OUTPUTS_VERSION: ${{ steps.next.outputs.version }}

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/frontends/python/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yaml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yaml\` tags this merge commit \`v${VERSION}\` and runs \`publish-crates.yaml\` (crates.io), \`publish-java.yaml\` (Maven Central), \`publish-go.yaml\` (the ZirekHQ/dengjen-tts-go mirror), \`publish-grpc.yaml\` (the gRPC server's GitHub Release), and \`publish-python.yaml\` (PyPI) all as jobs of that same run, no further approval needed. Review the version and the diff carefully before merging -- this is the real decision point." \
            --base main --head "$branch"

  # Override path: skip prepare/PR entirely and hand off straight to release.yaml. This is
  # the one path in the whole pipeline with no PR review to fall back on, so it's the only
  # thing that still needs a human gate.
  gate:
    if: inputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  release-now:
    needs: gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
      DEPLOY_APP_CLIENT_ID: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      DOCS_APP_CLIENT_ID: ${{ secrets.DOCS_APP_CLIENT_ID }}
      DOCS_APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
    with:
      new_tag: ${{ inputs.new_tag }}
      previous_tag: ${{ inputs.previous_tag }}
      dry_run: ${{ inputs.dry_run == true }}

  # Override-path counterpart of release.yaml's `pypi` job: PyPI Trusted Publishing is unsupported
  # from a reusable workflow, and release.yaml is reusable here, so the upload has to run in this
  # top-level file. Reads the `wheels-*` artifacts release.yaml's `python` job produced.
  pypi:
    needs: release-now
    if: "!cancelled() && needs.release-now.result != 'skipped' && inputs.dry_run != true"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
