name: STT and ort coexistence

# A red leg means ort and sherpa-onnx failed to link or run together on that OS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coexist:
    name: coexist (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x64, os: linux, runner: ubuntu-24.04 }
          - { name: windows-x64, os: windows, runner: windows-2022 }
          - { name: macos-arm64, os: macos, runner: macos-latest }
    env:
      DENGJEN_REQUIRE_COEXIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: ${{ matrix.platform.os == 'linux' && 'llvm llvm-dev llvm-runtime libclang-dev cmake protobuf-compiler espeak-ng' || '' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set CMAKE_GENERATOR for Windows
        if: matrix.platform.os == 'windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - if: matrix.platform.os == 'windows'
        run: choco install llvm protoc -y --no-progress
      - if: matrix.platform.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - if: matrix.platform.os == 'macos'
        run: |
          brew install llvm protobuf coreutils espeak-ng
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$(brew --prefix espeak-ng)/share" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Locate the espeak-ng data (Linux)
        if: matrix.platform.os == 'linux'
        shell: bash
        run: |
          data_dir="$(dirname "$(find /usr -maxdepth 5 -type d -name espeak-ng-data -not -path '/usr/share/doc/*' | head -n1)")"
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$data_dir" >> "$GITHUB_ENV"
      - name: Stage the espeak-ng data built from source (Windows)
        if: matrix.platform.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-espeak-data.sh "$RUNNER_TEMP/espeak"
          echo "DENGJEN_ESPEAKNG_DATA_DIRECTORY=$RUNNER_TEMP/espeak" >> "$GITHUB_ENV"
      - name: Fetch the Piper voice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-manifest-fixtures.sh .github/bench-fixtures.json . piper-std
          echo "DENGJEN_COEXIST_VOICE_CONFIG=$GITHUB_WORKSPACE/crates/dengjen/synth/models/std/model.onnx.json" >> "$GITHUB_ENV"
      - name: Fetch the recognition model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary :all: huggingface_hub==0.34.4
          python3 - <<'PY'
          import json, os
          from huggingface_hub import snapshot_download
          spec = json.load(open(".github/stt-smoke-model.json"))
          path = snapshot_download(spec["repo"], allow_patterns=spec["files"], local_dir=os.environ["RUNNER_TEMP"] + "/stt-model")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DENGJEN_STT_MODEL_DIR={path}\n")
          PY
      # No `shell: bash`: Git's link.exe would shadow the MSVC linker on Windows.
      # Windows searches System32 before PATH, and System32 holds an old onnxruntime.dll that crashes
      # sherpa-onnx. The shipped archive puts sherpa-onnx's DLLs beside the executable, so do the same.
      - name: Build the test binary (Windows)
        if: matrix.platform.os == 'windows'
        run: cargo test --locked -p dengjen-tts-grpc --features stt --test coexist --no-run
      - name: Put sherpa-onnx's DLLs beside the test binary (Windows)
        if: matrix.platform.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          prebuilt=(target/sherpa-onnx-prebuilt/*/ target/*/sherpa-onnx-prebuilt/*/)
          [ "${#prebuilt[@]}" -eq 1 ] || { echo "::error::expected one sherpa-onnx-prebuilt directory" >&2; exit 1; }
          cp "${prebuilt[0]}"lib/*.dll "${prebuilt[0]}"bin/*.dll target/debug/deps/ 2>/dev/null || true
          for dll in onnxruntime.dll sherpa-onnx-c-api.dll; do
            [ -f "target/debug/deps/$dll" ] || { echo "::error::$dll missing beside the test binary" >&2; exit 1; }
          done
      # Each order runs in its own process, because the first library to load a runtime wins.
      - name: Run ort first, then sherpa-onnx
        env:
          DENGJEN_COEXIST_ORDER: ort-first
        run: cargo test --locked -p dengjen-tts-grpc --features stt --test coexist -- --nocapture
      - name: Run sherpa-onnx first, then ort
        if: ${{ !cancelled() }}
        env:
          DENGJEN_COEXIST_ORDER: sherpa-first
        run: cargo test --locked -p dengjen-tts-grpc --features stt --test coexist -- --nocapture

  # Duplicate `onnx::` symbols between the ort and sherpa-onnx iOS archives fail at link time,
  # so a linked test binary answers the spike before anything runs.
  coexist-ios:
    name: coexist (ios-simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DENGJEN_REQUIRE_COEXIST: "1"
      IOS_TARGET: aarch64-apple-ios-sim
      SIMCTL_CHILD_DENGJEN_COEXIST_TEXT_PHONEMES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
        timeout-minutes: 15
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: |
          brew install llvm protobuf coreutils
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Add the iOS simulator target
        run: rustup target add "$IOS_TARGET"
      - name: Fetch the Piper voice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-manifest-fixtures.sh .github/bench-fixtures.json . piper-std
          echo "DENGJEN_COEXIST_VOICE_CONFIG=$GITHUB_WORKSPACE/crates/dengjen/synth/models/std/model.onnx.json" >> "$GITHUB_ENV"
      - name: Fetch the recognition model
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary :all: huggingface_hub==0.34.4
          python3 - <<'PY'
          import json, os
          from huggingface_hub import snapshot_download
          spec = json.load(open(".github/stt-smoke-model.json"))
          path = snapshot_download(spec["repo"], allow_patterns=spec["files"], local_dir=os.environ["RUNNER_TEMP"] + "/stt-model")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DENGJEN_STT_MODEL_DIR={path}\n")
          PY
      - name: Link the test binary against both runtimes
        run: |
          set -euo pipefail
          cargo test --locked -p dengjen-tts-grpc --no-default-features --features stt --test coexist \
            --target "$IOS_TARGET" --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          bin="$(jq -r 'select(.profile.test == true and .target.name == "coexist") | .executable' "$RUNNER_TEMP/build.json" | tail -n1)"
          [ -n "$bin" ] || { echo "::error::no coexist test binary was linked" >&2; exit 1; }
          echo "COEXIST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Boot a simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | head -n1)"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      # The test binary has no rpath to the sherpa-onnx framework that an app bundle would embed.
      - name: Locate the sherpa-onnx framework
        run: |
          set -euo pipefail
          fw="$(find target -type d -name SherpaOnnxC.framework -path '*ios*simulator*' | head -n1)"
          [ -n "$fw" ] || fw="$(find target -type d -name SherpaOnnxC.framework | head -n1)"
          [ -n "$fw" ] || { echo "::error::SherpaOnnxC.framework not found under target/" >&2; exit 1; }
          echo "Using $fw"
          echo "SHERPA_FRAMEWORK_DIR=$GITHUB_WORKSPACE/$(dirname "$fw")" >> "$GITHUB_ENV"
      # simctl forwards only SIMCTL_CHILD_-prefixed variables to the spawned process.
      - name: Run ort first, then sherpa-onnx
        env:
          SIMCTL_CHILD_DENGJEN_COEXIST_ORDER: ort-first
          SIMCTL_CHILD_DENGJEN_REQUIRE_COEXIST: "1"
          SIMCTL_CHILD_DYLD_FRAMEWORK_PATH: ${{ env.SHERPA_FRAMEWORK_DIR }}
          SIMCTL_CHILD_DENGJEN_COEXIST_VOICE_CONFIG: ${{ env.DENGJEN_COEXIST_VOICE_CONFIG }}
          SIMCTL_CHILD_DENGJEN_STT_MODEL_DIR: ${{ env.DENGJEN_STT_MODEL_DIR }}
        run: xcrun simctl spawn "$SIM_UDID" "$COEXIST_BIN" --nocapture
      - name: Run sherpa-onnx first, then ort
        if: ${{ !cancelled() }}
        env:
          SIMCTL_CHILD_DENGJEN_COEXIST_ORDER: sherpa-first
          SIMCTL_CHILD_DENGJEN_REQUIRE_COEXIST: "1"
          SIMCTL_CHILD_DYLD_FRAMEWORK_PATH: ${{ env.SHERPA_FRAMEWORK_DIR }}
          SIMCTL_CHILD_DENGJEN_COEXIST_VOICE_CONFIG: ${{ env.DENGJEN_COEXIST_VOICE_CONFIG }}
          SIMCTL_CHILD_DENGJEN_STT_MODEL_DIR: ${{ env.DENGJEN_STT_MODEL_DIR }}
        run: xcrun simctl spawn "$SIM_UDID" "$COEXIST_BIN" --nocapture
