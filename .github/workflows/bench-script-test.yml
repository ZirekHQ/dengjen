name: Bench Script Tests

on:
  pull_request:
    paths:
      - ".github/scripts/bench-compare.py"
      - ".github/scripts/test_bench_compare.py"
      - ".github/scripts/testdata/**"
      - ".github/workflows/bench-script-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unit-test compare script
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_bench_compare.py'
