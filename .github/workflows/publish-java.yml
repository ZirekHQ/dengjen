name: Publish Java bindings

on:
  # Called as a job of release.yml's flow. release.yml has no gate of its own: the push-to-main
  # path is gated by the PR merge that triggers it, and the override path is gated by
  # prepare-release.yml's own `gate` job before it ever calls release.yml.
  workflow_call:
    inputs:
      tag:
        description: "java-vX.Y.Z to publish"
        required: true
        type: string
      previous_tag:
        description: "Override changelog baseline tag"
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME:
        required: true
      JRELEASER_MAVENCENTRAL_PASSWORD:
        required: true
      JRELEASER_GPG_PASSPHRASE:
        required: true
      JRELEASER_GPG_SECRET_KEY:
        required: true
      JRELEASER_GPG_PUBLIC_KEY:
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # github.workflow_ref stays bound to the top-level caller through nested workflow_call hops
      # too -- release.yml (always @refs/heads/main) or prepare-release.yml (the override path,
      # which can legitimately run from a stale-retry tag ref, not just main).
      - name: verify this workflow was only reached through release.yml or prepare-release.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          expected_release="ZirekHQ/dengjen-tts/.github/workflows/release.yml@refs/heads/main"
          expected_prepare_path="ZirekHQ/dengjen-tts/.github/workflows/prepare-release.yml"
          actual_path="${WORKFLOW_REF%@*}"
          if [ "$WORKFLOW_REF" != "$expected_release" ] && [ "$actual_path" != "$expected_prepare_path" ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected '${expected_release}' or '${expected_prepare_path}@<any ref>' -- refusing to run outside release.yml's main-branch flow or prepare-release.yml's override path" >&2
            exit 1
          fi
      - name: Check whether this version is already on Maven Central
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#java-v}"
          url="https://repo1.maven.org/maven2/io/github/zirekhq/dengjen-tts/${version}/dengjen-tts-${version}.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          case "$status" in
            200)
              echo "::notice::dengjen-tts ${version} is already on Maven Central -- skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected HTTP ${status} checking Maven Central for dengjen-tts ${version}" >&2
              exit 1
              ;;
          esac

  build-natives:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - classifier: linux-x86_64
            runner: ubuntu-22.04
          - classifier: linux-aarch64
            runner: ubuntu-22.04-arm
          - classifier: windows-x64
            runner: windows-2022
          - classifier: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          # Windows/macOS have no apt-get; their compiler toolchain installs below stay inline.
          apt-packages: ${{ runner.os == 'Linux' && 'llvm llvm-dev llvm-runtime libclang-dev' || '' }}
      - name: Set CMAKE_GENERATOR for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: install libclang (windows)
        if: runner.os == 'Windows'
        run: choco install llvm
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: install libclang (macos)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Build libdengjen
        run: cargo build --release --manifest-path Cargo.toml -p libdengjen --locked
      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "native-artifacts/${{ matrix.platform.classifier }}"
          case "${{ runner.os }}" in
            Linux) lib="target/release/liblibdengjen.so" ;;
            macOS) lib="target/release/liblibdengjen.dylib" ;;
            Windows) lib="target/release/libdengjen.dll" ;;
          esac
          cp "$lib" "native-artifacts/${{ matrix.platform.classifier }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform.classifier }}
          path: native-artifacts/${{ matrix.platform.classifier }}

  release:
    needs: [check, build-natives]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for JReleaser's conventional-commits changelog; VERSIONING_GIT_TAG (below) drives the actual version resolution
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A publish-credentialed job must never consume a cache entry a
          # less-trusted run could have written.
          cache-disabled: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/java/native-artifacts
          pattern: "native-*"
      - name: Flatten downloaded native artifacts
        working-directory: bindings/java/native-artifacts
        run: for d in native-*; do mv "$d" "${d#native-}"; done
      - name: Publish
        working-directory: bindings/java
        env:
          # git-versioning reads GITHUB_REF (not the checkout), so naming the tag here is what
          # makes this build the release version instead of a branch snapshot.
          VERSIONING_GIT_TAG: ${{ inputs.tag }}
          JRELEASER_PREVIOUS_TAG_OVERRIDE: ${{ inputs.previous_tag }}
          JRELEASER_DRY_RUN_OVERRIDE: ${{ inputs.dry_run }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish jreleaserFullRelease --no-daemon --stacktrace
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-release
          path: |
            bindings/java/build/jreleaser/trace.log
            bindings/java/build/jreleaser/output.properties
          if-no-files-found: ignore
