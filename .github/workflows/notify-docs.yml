name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/python/**'
      - 'examples/grpc/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or tag to notify about
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    # Non-version releases (e.g. bench-fixtures-v1) must not ping the docs site.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            ref="$RELEASE_TAG"
          else
            ref="${INPUT_REF:-$REF_NAME}"
          fi
          if ! git check-ref-format --branch "$ref" >/dev/null 2>&1 \
             && ! git check-ref-format "refs/tags/$ref" >/dev/null 2>&1; then
            echo "Invalid ref: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build payload
        id: payload
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ steps.resolve.outputs.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          payload=$(jq -nc --arg repository "$REPOSITORY" --arg ref "$REF" --arg actor "$ACTOR" \
            '{repository: $repository, ref: $ref, actor: $actor}')
          echo "json=$payload" >> "$GITHUB_OUTPUT"

      - name: Create docs App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: ZirekHQ
          repositories: ZirekHQ.github.io
          permission-contents: write

      - name: Dispatch update to docs site
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ZirekHQ/ZirekHQ.github.io
          event-type: update-docs
          client-payload: ${{ steps.payload.outputs.json }}
