name: Release

# No trigger or gate of its own -- prepare-release.yaml is the single entry point (its `prepare`
# job for the PR-merge path, `gate`+`release-now` for the override path). Reacts to that PR's
# merge landing on main (push) or the override path's direct call (workflow_call).
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      new_tag:
        required: false
        type: string
      previous_tag:
        description: "Override Java changelog baseline"
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      JRELEASER_MAVENCENTRAL_USERNAME:
        required: false
      JRELEASER_MAVENCENTRAL_PASSWORD:
        required: false
      JRELEASER_GPG_PASSPHRASE:
        required: false
      JRELEASER_GPG_SECRET_KEY:
        required: false
      JRELEASER_GPG_PUBLIC_KEY:
        required: false
      DEPLOY_APP_CLIENT_ID:
        required: false
      DEPLOY_APP_PRIVATE_KEY:
        required: false
      MASTODON_INSTANCE_URL:
        required: false
      MASTODON_ACCESS_TOKEN:
        required: false
      BLUESKY_HANDLE:
        required: false
      BLUESKY_APP_PASSWORD:
        required: false
      DOCS_APP_CLIENT_ID:
        required: false
      DOCS_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # github.event_name inherits the top-level caller's event through nested workflow_call hops,
    # not literally 'workflow_call' -- inputs.new_tag != '' detects the override path directly.
    if: >-
      inputs.new_tag != '' ||
      startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::new_tag '${NEW_TAG}' (${version}) doesn't match Cargo.toml's workspace version (${cargo_version}) -- crates.io/PyPI publish from this checkout's Cargo.toml, not the tag, so a mismatch would silently publish the wrong version under this tag" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin, not the local clone -- checkout's shallow fetch wouldn't reliably reflect a tag pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  # Runs before anything is published, so a natives failure stops the whole release instead of
  # leaving crates.io ahead of Maven Central, PyPI and the GitHub releases.
  crates:
    name: crates.io
    needs: [tag-and-release, natives]
    if: "!cancelled() && needs.tag-and-release.result == 'success' && needs.natives.result == 'success'"
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-crates.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      dry_run: ${{ inputs.dry_run == true }}

  natives:
    name: Assemble desktop natives
    needs: tag-and-release
    if: "!cancelled() && needs.tag-and-release.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/assemble-natives.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support

  java:
    name: Maven Central (Java bindings)
    needs: [tag-and-release, natives]
    if: "!cancelled() && needs.tag-and-release.result == 'success' && needs.natives.result == 'success'"
    permissions:
      contents: write
    uses: ./.github/workflows/publish-java.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: java-v${{ needs.tag-and-release.outputs.version }}
      previous_tag: ${{ inputs.previous_tag }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      # push: the org secret; workflow_call from prepare-release.yaml: the JRELEASER_* input it maps.
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME || secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD || secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

  go:
    name: dengjen-tts-go mirror
    needs: [tag-and-release, natives]
    if: "!cancelled() && needs.tag-and-release.result == 'success' && needs.natives.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-go.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: go-release-v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      DEPLOY_APP_CLIENT_ID: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
      DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

  grpc:
    name: gRPC server GitHub Release
    needs: [tag-and-release, natives]
    if: "!cancelled() && needs.tag-and-release.result == 'success' && needs.natives.result == 'success'"
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-grpc.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: grpc-release-v${{ needs.tag-and-release.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}

  deb:
    name: Debian packages
    needs: tag-and-release
    if: "!cancelled() && needs.tag-and-release.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-deb.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support

  android:
    name: Android AARs
    needs: tag-and-release
    if: "!cancelled() && needs.tag-and-release.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-android.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}

  apple:
    name: Apple XCFramework
    needs: tag-and-release
    if: "!cancelled() && needs.tag-and-release.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-apple.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}

  espeak-data:
    name: eSpeak-ng data
    needs: tag-and-release
    if: "!cancelled() && needs.tag-and-release.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-espeak-data.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}

  python:
    name: Python wheels
    needs: [tag-and-release, natives]
    if: "!cancelled() && needs.tag-and-release.result == 'success' && needs.natives.result == 'success'"
    permissions:
      contents: read
    uses: ./.github/workflows/publish-python.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support

  # PyPI Trusted Publishing matches the workflow file holding this job and is unsupported from a
  # reusable one, so it can't live in publish-python.yaml. Runs only on the push path, where
  # release.yaml is top-level -- the override path publishes from prepare-release.yaml instead.
  # Requires a PyPI trusted publisher for `pydengjen` on release.yaml and prepare-release.yaml.
  pypi:
    name: PyPI
    needs: python
    if: "!cancelled() && github.event_name == 'push' && needs.python.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  # Installs what just reached crates.io and PyPI and synthesizes once. Runs on the push path only:
  # the override path publishes to PyPI from prepare-release.yaml, after this workflow returns.
  smoke:
    name: Post-publish smoke
    needs: [tag-and-release, crates, pypi, grpc]
    if: >-
      !cancelled() && inputs.dry_run != true &&
      needs.crates.result == 'success' && needs.pypi.result == 'success' &&
      needs.grpc.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/post-publish-smoke.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      version: ${{ needs.tag-and-release.outputs.version }}

  # Represents the whole repo -- crates/java/go/grpc jobs only publish artifact-scoped releases,
  # so without this job GitHub's `/releases/latest` would fall back to whichever component
  # release published last.
  github-release:
    name: Whole-repo GitHub Release
    # On the override path `pypi` is skipped (prepare-release.yaml publishes to PyPI after this
    # workflow returns), so only the wheel build gates the release there.
    needs: [tag-and-release, crates, java, go, grpc, deb, android, apple, espeak-data, python, pypi]
    if: >-
      !cancelled() && inputs.dry_run != true &&
      needs.tag-and-release.result == 'success' &&
      needs.crates.result == 'success' && needs.java.result == 'success' &&
      needs.go.result == 'success' && needs.grpc.result == 'success' &&
      needs.deb.result == 'success' && needs.android.result == 'success' &&
      needs.apple.result == 'success' && needs.espeak-data.result == 'success' &&
      needs.python.result == 'success' &&
      (needs.pypi.result == 'success' ||
        (inputs.new_tag != '' && needs.pypi.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-aars
          path: android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apple-xcframework*
          merge-multiple: true
          path: apple
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: espeak-ng-data
          path: espeak
      # Scans every lockfile and manifest in the repo, fuzz crates and bindings included.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Name the SBOM after the version
        env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: mv sbom.cdx.json "dengjen-tts-${VERSION}.cdx.json"
      - name: Attest the SBOM's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dengjen-tts-*.cdx.json
            debs/*.deb
            android/*.aar
            android/SHA256SUMS-android.txt
            apple/*.zip
            apple/SHA256SUMS-apple*.txt
            espeak/*.tar.gz
            espeak/SHA256SUMS-espeak-ng-data.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        # Depends on every component job so this always publishes last, shown as "Latest". Each
        # component job skips a version it already published, so a re-run reaching this step
        # must skip the same way instead of hitting gh's already_exists error.
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          resolved="$(gh api "repos/${REPO}/git/refs/tags/${tag}" --jq .object.sha 2>/dev/null || true)"
          if [ "$resolved" != "$GITHUB_SHA" ]; then
            echo "::error::${tag} resolves to ${resolved:-<missing>} on origin, not this run's commit (${GITHUB_SHA})" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::${tag} already has a GitHub Release -- skipping"
            exit 0
          fi

          # Component releases (java-v*, grpc-release-v*) publish before this job and would
          # otherwise win --generate-notes's automatic "previous release" pick, scoping the
          # changelog to the wrong range.
          previous_tag="$(gh release list --repo "$REPO" --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vFx "$tag" | sort -rV | head -n1)"
          notes_args=(--generate-notes)
          if [ -n "$previous_tag" ]; then
            notes_args=(--generate-notes --notes-start-tag "$previous_tag")
          fi

          gh release create "$tag" \
            --repo "$REPO" \
            --title "$tag" \
            --verify-tag \
            "${notes_args[@]}" \
            "dengjen-tts-${VERSION}.cdx.json" \
            debs/*.deb \
            android/*.aar \
            android/SHA256SUMS-android.txt \
            apple/*.zip \
            apple/SHA256SUMS-apple*.txt \
            espeak/*.tar.gz \
            espeak/SHA256SUMS-espeak-ng-data.txt

  # A release created with GITHUB_TOKEN does not fire notify-docs.yaml's `release: published`
  # trigger, so the docs site is pinged by calling that workflow directly.
  docs:
    name: Notify the docs site
    needs: [tag-and-release, github-release]
    if: ${{ !cancelled() && inputs.dry_run != true && needs.github-release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/notify-docs.yaml # zizmor: ignore[self-repository] CI pins a zizmor that predates $/ syntax support
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
    secrets:
      DOCS_APP_CLIENT_ID: ${{ secrets.DOCS_APP_CLIENT_ID }}
      DOCS_APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

  announce:
    name: Announce the release
    needs: [tag-and-release, github-release]
    if: ${{ !cancelled() && inputs.dry_run != true && needs.github-release.result == 'success' }}
    permissions: {}
    uses: ZirekHQ/.github/.github/workflows/announce-release.yaml@aeeb653e77286d2bc445c6a34c0125acc6c60b6c # main
    with:
      tag: v${{ needs.tag-and-release.outputs.version }}
    secrets:
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
