# Manual prereqs this workflow can't create itself: ZirekHQ/dengjen-tts-go must already exist with a
# `main` branch (every release force-pushes an orphan commit onto it), and the
# zirekhq-deploy GitHub App must be installed on it with Contents: Read and write.
name: Publish Go bindings release

on:
  # Called as a job of release.yml's flow. release.yml has no gate of its own: the push-to-main
  # path is gated by the PR merge that triggers it, and the override path is gated by
  # prepare-release.yml's own `gate` job before it ever calls release.yml.
  workflow_call:
    inputs:
      tag:
        description: "go-release-vX.Y.Z to release"
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      DEPLOY_APP_CLIENT_ID:
        required: true
      DEPLOY_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # github.workflow_ref stays bound to the top-level caller through nested workflow_call hops
      # too -- release.yml (always @refs/heads/main) or prepare-release.yml (the override path,
      # which can legitimately run from a stale-retry tag ref, not just main).
      - name: verify this workflow was only reached through release.yml or prepare-release.yml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          expected_release="ZirekHQ/dengjen-tts/.github/workflows/release.yml@refs/heads/main"
          expected_prepare_path="ZirekHQ/dengjen-tts/.github/workflows/prepare-release.yml"
          actual_path="${WORKFLOW_REF%@*}"
          if [ "$WORKFLOW_REF" != "$expected_release" ] && [ "$actual_path" != "$expected_prepare_path" ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected '${expected_release}' or '${expected_prepare_path}@<any ref>' -- refusing to run outside release.yml's main-branch flow or prepare-release.yml's override path" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: verify the go.mod this release would generate resolves as a Go module
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/test-go-module-path.sh "${RELEASE_TAG#go-release-}"
      - name: Create deploy App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ZirekHQ
          repositories: dengjen-tts-go
          permission-contents: read
      - name: Check whether this version's tag already exists on dengjen-tts-go
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GO_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#go-release-}"
          existing="$(git ls-remote --refs "https://x-access-token:${GO_REPO_TOKEN}@github.com/ZirekHQ/dengjen-tts-go" "refs/tags/${version}" | cut -f1)"
          if [ -n "$existing" ]; then
            echo "::notice::${version} is already released on ZirekHQ/dengjen-tts-go -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: check
    if: needs.check.outputs.skip != 'true' || inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - target: x86_64
            rust-target: x86_64-unknown-linux-gnu
            artifact: libdengjen-linux-amd64
          - target: aarch64
            rust-target: aarch64-unknown-linux-gnu
            artifact: libdengjen-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # dtolnay/rust-toolchain's own `targets:` input installs for its *own* default ("stable")
      # toolchain -- cargo below actually runs under rust-toolchain.toml's 1.97.1 via rustup's
      # directory override, so the target has to be added there instead.
      - run: rustup target add ${{ matrix.platform.rust-target }}
      - if: matrix.platform.target != 'x86_64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: matrix.platform.target != 'x86_64'
        uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: cargo build (release)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked -p libdengjen --target ${{ matrix.platform.rust-target }}
      - name: assert no unbundled runtime dependency
        env:
          OUT_DIR: target/${{ matrix.platform.rust-target }}/release
        run: |
          set -euo pipefail
          lib="${OUT_DIR}/liblibdengjen.so"
          deps="$(readelf -d "$lib" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')"
          echo "Dynamic dependencies of ${lib}:"
          echo "$deps"
          rc=0
          while IFS= read -r dep; do
            case "$dep" in
              *onnxruntime*)
                if [[ ! -e "${OUT_DIR}/${dep}" ]]; then
                  echo "::error::${lib} requires ${dep}, which is not produced alongside it and would not be bundled" >&2
                  rc=1
                fi
                ;;
            esac
          done <<< "$deps"
          exit "$rc"
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: |
            target/${{ matrix.platform.rust-target }}/release/*.so
            target/${{ matrix.platform.rust-target }}/release/*.so.*
      - if: matrix.platform.target == 'x86_64'
        name: upload header
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdengjen-header
          path: crates/frontends/capi/libdengjen.h
  build-windows:
    needs: check
    if: needs.check.outputs.skip != 'true' || inputs.dry_run == true
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - name: install-clang
        run: choco install llvm -y --no-progress
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: cargo build (release)
        run: cargo build --release --locked -p libdengjen --target x86_64-pc-windows-msvc
      - name: assert no unbundled runtime dependency
        shell: bash
        env:
          OUT_DIR: target/x86_64-pc-windows-msvc/release
        run: |
          set -euo pipefail
          lib="${OUT_DIR}/libdengjen.dll"
          deps="$(llvm-objdump -p "$lib" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p')"
          echo "Imported DLLs of ${lib}:"
          echo "$deps"
          rc=0
          while IFS= read -r dep; do
            case "$dep" in
              *onnxruntime*|*ONNXRUNTIME*)
                if [[ ! -e "${OUT_DIR}/${dep}" ]]; then
                  echo "::error::${lib} imports ${dep}, which is not produced alongside it and would not be bundled" >&2
                  rc=1
                fi
                ;;
            esac
          done <<< "$deps"
          exit "$rc"
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdengjen-windows-amd64
          path: target/x86_64-pc-windows-msvc/release/*.dll
  build-macos:
    needs: check
    if: needs.check.outputs.skip != 'true' || inputs.dry_run == true
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: install libclang
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
      # channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - name: cargo build (release)
        env:
          RUSTFLAGS: "-C link-args=-Wl,-install_name,@rpath/liblibdengjen.dylib"
        run: cargo build --release --locked -p libdengjen --target aarch64-apple-darwin
      - name: assert no unbundled runtime dependency
        env:
          OUT_DIR: target/aarch64-apple-darwin/release
        run: |
          set -euo pipefail
          lib="${OUT_DIR}/liblibdengjen.dylib"
          deps="$(otool -L "$lib" | tail -n +2 | awk '{print $1}')"
          echo "Load commands of ${lib}:"
          echo "$deps"
          rc=0
          while IFS= read -r dep; do
            case "$dep" in
              *onnxruntime*)
                if [[ ! -e "${OUT_DIR}/$(basename "$dep")" ]]; then
                  echo "::error::${lib} loads ${dep}, which is not produced alongside it and would not be bundled" >&2
                  rc=1
                fi
                ;;
            esac
          done <<< "$deps"
          exit "$rc"
      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libdengjen-macos-arm64
          path: target/aarch64-apple-darwin/release/*.dylib

  assemble-and-push:
    needs: [check, build-linux, build-windows, build-macos]
    if: needs.check.outputs.skip != 'true' || inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      module_path: ${{ steps.version.outputs.module_path }}
      release_sha: ${{ steps.push-release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: dengjen-tts
          persist-credentials: false
      # Local-action paths resolve off $GITHUB_WORKSPACE, not this step's own `path:` -- since the
      # repo landed under dengjen-tts/, both the action reference and its own steps' cwd need it.
      - uses: ./dengjen-tts/.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        with:
          working-directory: dengjen-tts
      - name: Create deploy App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ZirekHQ
          repositories: dengjen-tts-go
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZirekHQ/dengjen-tts-go
          path: dengjen-tts-go
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: extract target version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#go-release-}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' does not carry a valid vX.Y.Z suffix" >&2
            exit 1
          fi
          module_path="$(bash dengjen-tts/scripts/go-module-path.sh "$version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "module_path=${module_path}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: assemble release snapshot
        run: |
          set -euo pipefail
          dst="dengjen-tts-go"

          find "$dst" -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          mkdir -p "$dst/lib/linux_amd64" "$dst/lib/linux_arm64" \
                   "$dst/lib/windows_amd64" "$dst/lib/darwin_arm64" \
                   "$dst/include"
          cp artifacts/libdengjen-linux-amd64/*.so*   "$dst/lib/linux_amd64/"
          cp artifacts/libdengjen-linux-arm64/*.so*   "$dst/lib/linux_arm64/"
          cp artifacts/libdengjen-windows-amd64/*.dll "$dst/lib/windows_amd64/"
          cp artifacts/libdengjen-macos-arm64/*.dylib "$dst/lib/darwin_arm64/"
          cp artifacts/libdengjen-header/libdengjen.h "$dst/include/"
          for expected in lib/linux_amd64/liblibdengjen.so \
                          lib/linux_arm64/liblibdengjen.so \
                          lib/windows_amd64/libdengjen.dll \
                          lib/darwin_arm64/liblibdengjen.dylib \
                          include/libdengjen.h; do
            if [[ ! -f "$dst/$expected" ]]; then
              echo "Missing expected release file: $expected" >&2
              exit 1
            fi
          done

          cp -r dengjen-tts/deps/dev/espeak-ng-data "$dst/espeak-ng-data"

          for f in callback.go error.go speak.go synthconfig.go voice.go; do
            cp "dengjen-tts/bindings/go/$f" "$dst/$f"
          done

          cat > "$dst/doc.go" <<'EOF'
          package dengjen
          EOF

          cat > "$dst/go.mod" <<EOF
          module ${STEPS_VERSION_OUTPUTS_MODULE_PATH}

          go 1.22
          EOF

          gen_cgo() {
            goos="$1"; goarch="$2"; libdir="$3"; libname="$4"; extra_ldflags="$5"; outfile="$6"
            cat > "$dst/$outfile" <<EOF
          //go:build ${goos} && ${goarch}

          package dengjen

          /*
          #cgo CFLAGS: -I\${SRCDIR}/include
          #cgo LDFLAGS: -L\${SRCDIR}/${libdir} -l${libname}${extra_ldflags:+ $extra_ldflags}
          */
          import "C"
          EOF
          }

          gen_cgo linux   amd64 lib/linux_amd64   libdengjen "-Wl,-rpath,\${SRCDIR}/lib/linux_amd64"   cgo_linux_amd64.go
          gen_cgo linux   arm64 lib/linux_arm64   libdengjen "-Wl,-rpath,\${SRCDIR}/lib/linux_arm64"   cgo_linux_arm64.go
          gen_cgo darwin  arm64 lib/darwin_arm64  libdengjen "-Wl,-rpath,\${SRCDIR}/lib/darwin_arm64"  cgo_darwin_arm64.go
          gen_cgo windows amd64 lib/windows_amd64 libdengjen ""                                        cgo_windows_amd64.go

          cat > "$dst/espeak_dir.go" <<'EOF'
          package dengjen

          import (
          	"os"
          	"path/filepath"
          	"runtime"
          )

          func defaultEspeakDataDir() string {
          	_, file, _, ok := runtime.Caller(0)
          	if !ok {
          		return ""
          	}
          	dir := filepath.Join(filepath.Dir(file), "espeak-ng-data")
          	if !filepath.IsAbs(dir) {
          		return ""
          	}
          	if _, err := os.Stat(dir); err != nil {
          		return ""
          	}
          	return dir
          }
          EOF

          cat > "$dst/espeak_data.go" <<'EOF'
          package dengjen

          import "os"

          func init() {
          	if _, set := os.LookupEnv("DENGJEN_ESPEAKNG_DATA_DIRECTORY"); set {
          		return
          	}
          	if dir := defaultEspeakDataDir(); dir != "" {
          		_ = os.Setenv("DENGJEN_ESPEAKNG_DATA_DIRECTORY", dir)
          	}
          }
          EOF

          cp dengjen-tts/LICENSE "$dst/LICENSE"

          cat > "$dst/NOTICE" <<EOF
          The binaries in this module were built from ZirekHQ/dengjen-tts at
          commit ${GITHUB_SHA}
          (https://github.com/ZirekHQ/dengjen-tts/tree/${GITHUB_SHA}).
          That exact tree — not the parent repository's moving \`main\`
          branch — is the corresponding source for this release under
          GPL-3.0-or-later.

          This module bundles third-party components as prebuilt native
          binaries. See the parent project's own NOTICE
          (https://github.com/ZirekHQ/dengjen-tts/blob/${GITHUB_SHA}/NOTICE)
          for the full attribution text; the same ONNX Runtime (MIT) and
          sonic (Apache-2.0) attributions apply here, since this module's
          binaries are built from that project's source. espeak-ng-data is
          bundled under its own GPL license; the parent project (and this
          module) are GPL-3.0-or-later.
          EOF

          cat > "$dst/README.md" <<EOF
          # dengjen-tts-go

          Go bindings for [dengjen-tts](https://github.com/ZirekHQ/dengjen-tts),
          published with prebuilt native binaries for linux/amd64,
          linux/arm64, windows/amd64, and darwin/arm64.

          \`\`\`bash
          go get ${STEPS_VERSION_OUTPUTS_MODULE_PATH}@${STEPS_VERSION_OUTPUTS_VERSION}
          \`\`\`

          This repository is generated on every release from
          [\`bindings/go\`](https://github.com/ZirekHQ/dengjen-tts/tree/main/bindings/go)
          in the parent monorepo — do not hand-edit files here; changes go
          through the parent repo's \`bindings/go\` instead, and a new
          tagged release regenerates this repo from it.

          On Windows, cgo has no rpath equivalent: copy
          \`lib/windows_amd64/libdengjen.dll\` next to your built executable
          (or put that directory on \`PATH\`) before running it. The name
          matters — that is the import name baked into the linked binary.
          \`libdengjen.dll\` is built with the MSVC toolchain's default
          dynamic C runtime, so it also needs the
          [Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist)
          (VCRUNTIME140.dll, MSVCP140.dll) installed on the target machine —
          already present on most Windows systems, but not guaranteed on a
          minimal one.
          EOF

          cat > "$dst/Makefile" <<'EOF'
          .PHONY: test vet fmt-check

          test:
          	go test ./... -v

          vet:
          	go vet ./...

          fmt-check:
          	@test -z "$$(gofmt -l .)" || (gofmt -l . && exit 1)
          EOF
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          STEPS_VERSION_OUTPUTS_MODULE_PATH: ${{ steps.version.outputs.module_path }}
      - name: commit and push release snapshot
        id: push-release
        working-directory: dengjen-tts-go
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "dengjen-tts-go release bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to release" >&2
            exit 1
          fi

          git checkout --orphan release-snapshot
          git add -A
          git commit -m "release: ${VERSION} (built from ZirekHQ/dengjen-tts@${GITHUB_SHA})"

          commits="$(git rev-list --count HEAD)"
          if [[ "$commits" -ne 1 ]]; then
            echo "Expected a single parentless release commit, found ${commits}" >&2
            exit 1
          fi

          git tag "$VERSION"
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "::notice::DRY RUN -- would push ${VERSION} (commit $(git rev-parse HEAD)) to ZirekHQ/dengjen-tts-go, skipping"
          else
            git push origin "refs/tags/${VERSION}"
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: assemble-and-push
    # Nothing was actually pushed to fetch on a dry run -- go get would just
    # fail against a tag that was only logged, not created.
    if: inputs.dry_run != true
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
          - runner: windows-2022
            goarch: amd64
          - runner: macos-latest
            goarch: arm64
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: fetch and build the just-published module (direct, bypassing the proxy cache)
        env:
          GOPROXY: direct
          GONOSUMDB: github.com/ZirekHQ/dengjen-tts-go
          GOFLAGS: '-mod=mod'
          NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_VERSION: ${{ needs.assemble-and-push.outputs.version }}
          NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_MODULE_PATH: ${{ needs.assemble-and-push.outputs.module_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dengjen-go-verify
          cd /tmp/dengjen-go-verify
          go mod init verify
          go get "${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_MODULE_PATH}@${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_VERSION}"

          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            mod_dir="$(go list -m -f '{{.Dir}}' "${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_MODULE_PATH}")"
            export PATH="${mod_dir}/lib/windows_amd64:${PATH}"
          fi

          cat > main_test.go <<EOF
          package main

          import (
          	"testing"

          	dengjen "${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_MODULE_PATH}"
          )

          func TestModuleResolves(t *testing.T) {
          	params := dengjen.SynthesisParams{Mode: dengjen.SynthModeLazy, Rate: 10, Volume: 100, Pitch: 50}
          	if params.Rate != 10 {
          		t.Fatalf("expected Rate 10, got %d", params.Rate)
          	}
          }
          EOF
          go test ./...

  rollback-on-failure:
    needs: [assemble-and-push, verify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not on the `release` environment: it only ever deletes a tag this same
    # already-gated run just pushed, and gating cleanup too would leave a failed tag stranded.
    permissions:
      contents: read
    steps:
      - name: Create deploy App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ZirekHQ
          repositories: dengjen-tts-go
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZirekHQ/dengjen-tts-go
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: delete failed release tag
        run: |
          set -euo pipefail
          version="${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_VERSION}"
          if [[ -z "$version" ]]; then
            echo "assemble-and-push produced no version output; nothing was tagged, nothing to roll back" >&2
            exit 0
          fi
          expected_sha="${NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_RELEASE_SHA}"
          if [[ -z "$expected_sha" ]]; then
            echo "This run's own tag push never succeeded; nothing to roll back" >&2
            exit 0
          fi
          actual_sha="$(git ls-remote --refs origin "refs/tags/${version}" | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::warning::tag ${version} does not point to this run's release commit (expected ${expected_sha}, found ${actual_sha:-<absent>}) — not deleting, to avoid removing an unrelated release"
            exit 0
          fi
          if git push --delete origin "$version"; then
            echo "Deleted tag ${version} from dengjen-tts-go after a failed release"
          else
            echo "::warning::tag ${version} was not present on origin (already deleted, or the push that would have created it never happened)"
          fi
        env:
          NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_VERSION: ${{ needs.assemble-and-push.outputs.version }}
          NEEDS_ASSEMBLE_AND_PUSH_OUTPUTS_RELEASE_SHA: ${{ needs.assemble-and-push.outputs.release_sha }}
