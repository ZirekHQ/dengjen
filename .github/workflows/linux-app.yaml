name: Linux app

# Builds, lints and tests the GTK 4 app in apps/linux, its own cargo workspace, on the GTK and
# libadwaita that Ubuntu 24.04 ships.
on:
  push:
    branches:
      - main
    paths:
      - "apps/linux/**"
      - "crates/app/**"
      - "crates/dengjen/**"
      - ".github/workflows/linux-app.yaml"
  pull_request:
    paths:
      - "apps/linux/**"
      - "crates/app/**"
      - "crates/dengjen/**"
      - ".github/workflows/linux-app.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK, libadwaita and ALSA headers
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libasound2-dev
      # toolchain input omitted: channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/linux
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The same package publish-deb.yaml builds at release, installed in a clean container.
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK, libadwaita and ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libasound2-dev
      # toolchain input omitted: channel comes from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/linux
          key: release
      - run: cargo build --release --locked --manifest-path apps/linux/Cargo.toml
      - name: Build the package
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb --manifest-path apps/linux/Cargo.toml --no-build --output target/debian/
      - name: Install it in a clean container
        run: |
          docker run --rm -v "$PWD/target/debian:/pkg:ro" ubuntu:24.04 sh -ec '
            apt-get update
            apt-get install -y /pkg/dengjen-gtk_*.deb
            test -x /usr/bin/dengjen-gtk
            test -f /usr/share/applications/io.github.zirekhq.Dengjen.desktop
            if ldd /usr/bin/dengjen-gtk | grep "not found"; then exit 1; fi
          '
