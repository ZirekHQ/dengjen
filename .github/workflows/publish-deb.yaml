name: Build Debian packages

on:
  # The whole-repo release job in release.yaml attaches the .deb artifacts.
  workflow_call:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # github.workflow_ref stays bound to the top-level caller through nested workflow_call hops.
      - name: verify this workflow was only reached through release.yaml or prepare-release.yaml
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          actual_path="${WORKFLOW_REF%@*}"
          if [ "$WORKFLOW_REF" != "ZirekHQ/dengjen/.github/workflows/release.yaml@refs/heads/main" ] \
            && [ "$actual_path" != "ZirekHQ/dengjen/.github/workflows/prepare-release.yaml" ]; then
            echo "::error::workflow_ref is '${WORKFLOW_REF}', expected release.yaml@refs/heads/main or prepare-release.yaml@<any ref> in ZirekHQ/dengjen -- refusing to run outside release.yaml's main-branch flow or prepare-release.yaml's override path" >&2
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev help2man jq
      - name: build the eSpeak-ng data
        # cargo-deb resolves non-release asset paths against the crate directory.
        run: bash scripts/stage-espeak-data.sh crates/frontends/cli/target/espeak --release
      - name: build the binary and man page
        run: |
          set -euo pipefail
          cargo build --release --locked -p dengjen-tts-cli
          # cargo-deb resolves non-release asset paths against the crate directory.
          man_dir=crates/frontends/cli/target/man
          mkdir -p "$man_dir"
          for sub in "" speak voices; do
            case "$sub" in
              "") name=dengjen; summary="speech synthesis and voice manager" ;;
              speak) name=dengjen-speak; summary="synthesize speech from text" ;;
              voices) name=dengjen-voices; summary="manage installed voices" ;;
            esac
            help2man --no-info --name "$summary" -h "${sub:+$sub }--help" target/release/dengjen \
              | sed "s/^\.TH DENGJEN /.TH ${name^^} /" \
              | gzip -9n > "$man_dir/$name.1.gz"
          done
      - name: build the Speech Dispatcher module
        run: |
          set -euo pipefail
          cargo build --release --locked -p dengjen-speechd
          # cargo-deb resolves non-release asset paths against the crate directory.
          mkdir -p crates/frontends/speechd/target
          cp -r crates/frontends/cli/target/espeak crates/frontends/speechd/target/espeak
      - name: build the packages
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb -p dengjen-tts-cli --no-build
          cargo deb -p dengjen-speechd --no-build
      - name: smoke test in a clean container
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/target/debian:/pkg:ro" ubuntu:24.04 sh -ec '
            apt-get update
            # An earlier release left a link to the distro data here; installing must replace it
            # and never write through it.
            mkdir -p /usr/lib/dengjen /tmp/distro-data
            ln -s /tmp/distro-data /usr/lib/dengjen/espeak-ng-data
            apt-get install -y /pkg/*.deb
            dengjen --help | grep -q voices
            test ! -L /usr/lib/dengjen/espeak-ng-data
            test -z "$(ls -A /tmp/distro-data)"
            # The package ships its own data, built from the pinned espeak-ng source.
            test -f /usr/lib/dengjen/espeak-ng-data/phontab
            test -f /usr/lib/dengjen/espeak-ng-data/ku_dict
            ! dpkg -s espeak-ng-data >/dev/null 2>&1
            status=0
            DENGJEN_VOICES_DIR=/tmp/voices DENGJEN_CATALOGUE_URL=http://127.0.0.1:9/voices.json \
              dengjen voices list || status=$?
            test "$status" -eq 1
            # With no voices installed, INIT must fail with 399.
            test -x /usr/lib/speech-dispatcher-modules/sd_dengjen
            test -f /etc/speech-dispatcher/modules/dengjen.conf
            test -f /usr/lib/speech-dispatcher-modules/espeak-ng-data/phontab
            printf "INIT\nQUIT\n" | DENGJEN_VOICES_DIR=/tmp/voices \
              /usr/lib/speech-dispatcher-modules/sd_dengjen | grep -q "^399 ERR CANT INIT MODULE"
          '
      - name: speak through the installed module
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/target/debian:/pkg:ro" -v "$PWD/scripts:/scripts:ro" ubuntu:24.04 sh -ec '
            apt-get update
            apt-get install -y ca-certificates /pkg/*.deb
            bash /scripts/speechd-smoke.sh
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error
