name: Sonar fork fallback

# Required check "SonarCloud Code Analysis" needs a status even for fork PRs, which never get
# SONAR_TOKEN (sonar.yaml skips them) -- this posts one via pull_request_target instead, since
# GITHUB_TOKEN is read-only on pull_request. It deliberately never checks out or runs PR code.

on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [ main ]

concurrency:
  group: sonar-fork-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  neutral_status:
    name: Sonar fork fallback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    # Same-repo PRs get a real analysis; never overwrite it.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Report the Sonar check as skipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='SonarCloud Code Analysis' \
            -f description='Skipped for fork PR: SONAR_TOKEN is unavailable' \
            -f target_url="${RUN_URL}"
