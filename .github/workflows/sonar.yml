name: Sonar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# SonarCloud keeps whichever report finishes processing last, not the newest
# commit, so overlapping scans can leave main showing an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Fork PRs are never given repository secrets, so SONAR_TOKEN would be empty
    # and the scan would fail with a red X the contributor cannot clear.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Sonar needs full history for new-code detection and blame
          persist-credentials: false
      - uses: ./.github/actions/setup-native-build-deps # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
        timeout-minutes: 15
        with:
          apt-packages: clang libclang-dev llvm-dev cmake protobuf-compiler

      # Go/Java bindings compile against libdengjen; building it here is what lets their coverage
      # steps below produce real numbers instead of leaving sonar.coverage at 0% (channel comes
      # from rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Java bindings coverage
        working-directory: bindings/java
        run: make coverage

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Go bindings coverage
        working-directory: bindings/go
        run: make coverage

      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
