[package]
name = "dengjen-stt"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Offline Kurmanji speech recognition on sherpa-onnx"
readme = "README.md"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# The default `static` feature fails to link next to `ort` (duplicate `onnx::` symbols at 1.13.8);
# recheck when the pin moves.
sha2 = "0.11"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"
