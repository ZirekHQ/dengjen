[package]
name = "dengjen-voices"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Voice catalogue, resumable verified download, install and removal for dengjen"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
fd-lock = "4"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
proptest = "1"
tempfile = "3"
