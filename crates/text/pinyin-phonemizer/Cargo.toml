[package]
name = "dengjen-pinyin-phonemizer"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Mandarin pinyin grapheme-to-phoneme conversion for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
dengjen-tts-core.workspace = true
ndarray = "0.17"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dependencies.ort]
version = "=2.0.0-rc.14"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
tempfile = "3"
