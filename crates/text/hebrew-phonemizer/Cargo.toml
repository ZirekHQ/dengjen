[package]
name = "dengjen-hebrew-phonemizer"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Hebrew grapheme-to-phoneme conversion (diacritization + IPA) for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
dengjen-tts-core = { workspace = true, features = ["ort-providers"] }
ndarray = "0.17"
unicode-normalization = "0.1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
