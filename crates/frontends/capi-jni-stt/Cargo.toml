[package]
name = "dengjen-capi-jni-stt"
version.workspace = true
edition = "2021"
license.workspace = true
description = "JNI bindings for the dengjen speech recognizer (Android)"
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "dengjen_stt_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
dengjen-capi-jni-common = { path = "../capi-jni-common" }
ffi-support = "0.4.4"
jni = "0.22.0"
libdengjen-stt = { path = "../capi-stt" }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
cc = "1"
