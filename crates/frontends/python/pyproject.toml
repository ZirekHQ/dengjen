[build-system]
requires = ["maturin>=1.9"]
build-backend = "maturin"

[project]
name = "pydengjen"
description = "Python bindings for the dengjen-tts speech synthesis engine"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["tts", "text-to-speech", "speech-synthesis", "onnx", "piper"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/ZirekHQ/dengjen"
Issues = "https://github.com/ZirekHQ/dengjen/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pydengjen.pydengjen"
include = [{ path = "python/pydengjen/espeak-ng-data/**/*", format = "wheel" }]
