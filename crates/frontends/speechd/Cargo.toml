[package]
name = "dengjen-speechd"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Speech Dispatcher output module for the dengjen speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "dengjen_speechd"
path = "src/lib.rs"

[[bin]]
name = "sd_dengjen"
path = "src/main.rs"

[features]
default = ["espeak", "kurmanji"]
espeak = ["dengjen-tts-piper/espeak"]
kurmanji = ["dengjen-tts-piper/kurmanji"]
ort-dylib = ["ort/load-dynamic"]

[dependencies]
dengjen-tts.workspace = true
dengjen-tts-core = { workspace = true, features = ["ort-providers"] }
dengjen-tts-piper.workspace = true
dirs = "7"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[package.metadata.deb]
name = "dengjen-speechd"
section = "sound"
priority = "optional"
depends = "$auto, speech-dispatcher"
maintainer = "austek <13117393+austek@users.noreply.github.com>"
extended-description = "Speech Dispatcher output module that speaks with dengjen voices, including Kurmanji."
assets = [
    ["target/release/sd_dengjen", "usr/lib/speech-dispatcher-modules/sd_dengjen", "755"],
    # The module looks for espeak-ng-data beside its executable.
    ["target/espeak/espeak-ng-data/**/*", "usr/lib/speech-dispatcher-modules/espeak-ng-data/", "644"],
    ["debian/dengjen.conf", "etc/speech-dispatcher/modules/dengjen.conf", "644"],
    ["README.md", "usr/share/doc/dengjen-speechd/README.md", "644"],
]

[dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
