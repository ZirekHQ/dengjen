[package]
name = "dengjen-tts-cli"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Command-line interface for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "dengjen"
path = "src/main.rs"

[features]
default = ["espeak"]
espeak = ["dengjen-tts-piper/espeak", "dengjen-tts-kokoro/espeak", "dengjen-tts-melotts/espeak"]
japanese = ["dengjen-tts-kokoro/japanese"]
hebrew = ["dengjen-tts-piper/hebrew"]
pinyin = ["dengjen-tts-piper/pinyin", "dengjen-tts-melotts/pinyin"]
kurmanji = ["dengjen-tts-piper/kurmanji"]


cuda = ["dengjen-tts-piper/cuda", "dengjen-tts-kokoro/cuda", "dengjen-tts-melotts/cuda"]
coreml = ["dengjen-tts-piper/coreml", "dengjen-tts-kokoro/coreml", "dengjen-tts-melotts/coreml"]
directml = ["dengjen-tts-piper/directml", "dengjen-tts-kokoro/directml", "dengjen-tts-melotts/directml"]
ort-dylib = ["ort/load-dynamic"]

[dependencies]
dengjen-tts.workspace = true
dengjen-tts-core = { workspace = true, features = ["ort-providers"] }
dengjen-tts-piper.workspace = true
dengjen-tts-kokoro.workspace = true
dengjen-tts-melotts.workspace = true
dengjen-voices.workspace = true
anyhow = "1.0.79"
log = "0.4.18"
ctrlc = "3"
dirs = "7"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dependencies.tracing-subscriber]
version = "0.3"
features = ["fmt", "env-filter"]

[dependencies.clap]
version = "4.3.2"
features = ["derive", "env"]

[dependencies.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
dengjen-espeak-phonemizer.workspace = true
sha2 = "0.11"
tempfile = "3"

[package.metadata.deb]
name = "dengjen"
section = "sound"
priority = "optional"
depends = "$auto"
maintainer = "austek <13117393+austek@users.noreply.github.com>"
extended-description = "Command-line speech synthesis and voice manager."
maintainer-scripts = "debian"
assets = [
    ["target/release/dengjen", "usr/lib/dengjen/dengjen", "755"],
    # Staged by scripts/stage-espeak-data.sh, built from the pinned espeak-ng source. The binary
    # looks for it beside itself; the distro's espeak-ng-data lacks upstream fixes such as the
    # Kurmanji word stress.
    ["target/espeak/espeak-ng-data/**/*", "usr/lib/dengjen/espeak-ng-data/", "644"],
    ["README.md", "usr/share/doc/dengjen/README.md", "644"],
    ["target/man/dengjen.1.gz", "usr/share/man/man1/dengjen.1.gz", "644"],
    ["target/man/dengjen-speak.1.gz", "usr/share/man/man1/dengjen-speak.1.gz", "644"],
    ["target/man/dengjen-voices.1.gz", "usr/share/man/man1/dengjen-voices.1.gz", "644"],
]
