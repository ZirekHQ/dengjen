[package]
name = "libdengjen"
version.workspace = true
edition = "2021"
license.workspace = true
description = "C API bindings for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "libdengjen"
crate-type = ["staticlib", "cdylib"]

[features]
default = ["piper", "espeak"]
piper = ["dep:dengjen-tts-piper", "dep:ort"]
espeak = ["dengjen-tts-piper/espeak", "dengjen-tts-kokoro/espeak", "dengjen-tts-melotts/espeak"]
japanese = ["dengjen-tts-kokoro/japanese"]



cuda = ["dengjen-tts-piper/cuda", "dengjen-tts-kokoro/cuda", "dengjen-tts-melotts/cuda"]
coreml = ["dengjen-tts-piper/coreml", "dengjen-tts-kokoro/coreml", "dengjen-tts-melotts/coreml"]
directml = ["dengjen-tts-piper/directml", "dengjen-tts-kokoro/directml", "dengjen-tts-melotts/directml"]
ort-dylib = ["ort/load-dynamic"]

[dependencies]
dengjen-tts-core.workspace = true
dengjen-tts.workspace = true
ffi-support = "0.4.4"
libc = "0.2.150"
dengjen-tts-piper = { workspace = true, optional = true }
dengjen-tts-kokoro.workspace = true
dengjen-tts-melotts.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]
optional = true

[target.'cfg(target_os="android")'.dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27", "nnapi"]
optional = true

[target.'cfg(target_os="ios")'.dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27", "coreml"]
optional = true

[build-dependencies]
cbindgen = "0.29.4"
