[package]
name = "dengjen-tts-kokoro"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Kokoro neural TTS model backend for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
espeak = ["dep:dengjen-espeak-phonemizer"]
japanese = ["dep:jpreprocess"]


cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[dependencies]
dengjen-tts-core.workspace = true
dengjen-espeak-phonemizer = { workspace = true, optional = true }
jpreprocess = { version = "=0.15.0", optional = true }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
ndarray = "0.17"
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
tracing-test = { workspace = true }
