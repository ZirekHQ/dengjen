[package]
name = "dengjen-tts-melotts"
version.workspace = true
edition = "2021"
license.workspace = true
description = "MeloTTS neural TTS model backend for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
espeak = ["dep:dengjen-espeak-phonemizer"]
pinyin = ["dep:dengjen-pinyin-phonemizer"]
cuda = ["ort/cuda", "dengjen-tts-core/cuda"]
coreml = ["ort/coreml", "dengjen-tts-core/coreml"]
directml = ["ort/directml", "dengjen-tts-core/directml"]

[dependencies]
dengjen-tts-core = { workspace = true, features = ["ort-providers"] }
dengjen-espeak-phonemizer = { workspace = true, optional = true }
dengjen-pinyin-phonemizer = { workspace = true, optional = true }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
ndarray = "0.17"
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[dev-dependencies]
tracing-test = { workspace = true }
