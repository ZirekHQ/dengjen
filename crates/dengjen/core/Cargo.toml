[package]
name = "dengjen-tts-core"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Core error types, synthesis configuration, and shared primitives for the dengjen-tts speech synthesis engine"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
ort-providers = ["dep:ort"]
cuda = ["ort-providers", "ort/cuda"]
coreml = ["ort-providers", "ort/coreml"]
directml = ["ort-providers", "ort/directml"]

[dependencies]
dengjen-audio-ops.workspace = true
once_cell = "1.18.0"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std"]
optional = true
