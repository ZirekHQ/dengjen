[package]
name = "dengjen-tts"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Speech synthesis orchestration engine combining neural TTS model backends with audio post-processing"
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "dengjen_tts"

[dependencies]
dengjen-tts-core.workspace = true
dengjen-audio-ops.workspace = true
rayon = "1.7.0"
once_cell = "1.18.0"
flume = { version = "0.12.0", default-features = false, features = ["async"] }
serde_json = "1.0.89"
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
dengjen-tts-piper.workspace = true
dengjen-tts-kokoro = { workspace = true, features = ["espeak"] }
dengjen-espeak-phonemizer.workspace = true
once_cell = "1.18.0"
divan = "0.1.2"
tempfile = "3"
proptest = "1"
tracing-test = { workspace = true }

[dev-dependencies.ort]
version = "=2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-27"]

[[bench]]
name = "benchmarks"
path = "src/benchmarks.rs"
harness = false

[[test]]
name = "tests"
path = "src/tests.rs"
