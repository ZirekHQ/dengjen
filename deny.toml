[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = [
    # paste is unmaintained (transitive via tokenizers -> pinyin-phonemizer); upstream declined
    # to migrate: https://github.com/huggingface/tokenizers/issues/1833
    # Kept in sync with rust-lint.yaml's audit job, this repo's actual advisory gate.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "Zlib",
    "bzip2-1.0.6",
    "MIT-0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
