[package]
name = "dengjen-espeak-rs-sys"
version = "0.2.0"
edition = "2024"
description = "Rust bindings to espeak-ng"
license = "GPL-3.0-or-later"
repository = "https://github.com/ZirekHQ/dengjen-piper-rs"

include = [
    "espeak-ng/CMakeLists.txt",
    "espeak-ng/vim/",
    "espeak-ng/cmake/",
    "espeak-ng/phsource/",
    "espeak-ng/tests/",
    "espeak-ng/src/",
    "espeak-ng/espeak-ng-data/",
    "espeak-ng/dictsource/**",
    "espeak-ng/espeak-ng.pc.in",
    "src/*.rs",
    "build.rs",
    "wrapper.h",
    # Omit too big files from dictsource, except ru_listx: espeak-ng's
    # data.cmake wires it into the Russian dictionary automatically
    # (EXTRA_ru option, default ON) when compile-espeak-intonations is
    # enabled, so dropping it silently degrades Russian pronunciation
    # for anyone building from the published crate. See #23.
    "!espeak-ng/dictsource/extra/**",
    "espeak-ng/dictsource/extra/ru_listx",
    "!espeak-ng/dictsource/fo_list",
    "!espeak-ng/src/windows/Debug/*.wav",
]

[build-dependencies]
bindgen = "0.72.1"
cmake = "0.1"
glob = "0.3.1"

[dev-dependencies]
bindgen = "0.72.1"
cmake = "0.1"
glob = "0.3.1"

[features]
default = []
compile-espeak-intonations = []

# Registers build.rs's own `#[cfg(test)]` module as a runnable test target.
# Cargo never tests a `build-dependencies`-only build script on its own —
# `cargo test` only compiles and runs `src/`, so these units were dead code
# until now. See issue #10.
[[test]]
name = "build_script_unit_tests"
path = "build.rs"
