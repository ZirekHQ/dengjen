[package]
name = "dengjen-espeak-rs-sys"
version = "0.2.0"
edition = "2024"
description = "Rust bindings to espeak-ng"
license = "GPL-3.0-or-later"
repository = "https://github.com/ZirekHQ/dengjen-piper-rs"

include = [
    # The espeak-ng submodule tree itself (dictsource/phsource/src/... --
    # see scripts/bundle-espeak-ng.sh for exactly what's in it and why) gzips
    # to over crates.io's 10MiB .crate cap. cargo's .crate container is
    # hardcoded to gzip (rust-lang/cargo#2526), so it's pre-compressed with
    # xz instead -- xz -9e gets the same content to ~7.7MiB -- and shipped
    # as one blob that build.rs decompresses at build time.
    "bundled/espeak-ng.tar.xz",
    "src/*.rs",
    "build.rs",
    "wrapper.h",
]

[build-dependencies]
bindgen = "0.72.1"
cmake = "0.1"
glob = "0.3.1"
lzma-rs = "0.3.0"
tar = "0.4.46"

[dev-dependencies]
bindgen = "0.72.1"
cmake = "0.1"
glob = "0.3.1"
lzma-rs = "0.3.0"
tar = "0.4.46"

[features]
default = []
compile-espeak-intonations = []

# Registers build.rs's own `#[cfg(test)]` module as a runnable test target.
# Cargo never tests a `build-dependencies`-only build script on its own —
# `cargo test` only compiles and runs `src/`, so these units were dead code
# until now. See issue #10.
[[test]]
name = "build_script_unit_tests"
path = "build.rs"
