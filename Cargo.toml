[workspace]
resolver = "2"

members = [
    "crates/dengjen/core",
    "crates/dengjen/synth",
    "crates/dengjen/models/piper",
    "crates/dengjen/models/kokoro",
    "crates/dengjen/models/melotts",
    "crates/frontends/grpc",
    "crates/frontends/python",
    "crates/frontends/capi",
    "crates/frontends/cli",
    "crates/text/espeak-phonemizer",
    "crates/text/hebrew-phonemizer",
    "crates/text/pinyin-phonemizer",
    "crates/audio/sonic-sys",
    "crates/audio/ops",
    "crates/workspace-hack",
]

[workspace.package]



version = "2.1.0"
# Floor set by the highest dependency-declared rust-version in the tree (ort/ort-sys at
# 1.88, per `cargo metadata`), then confirmed to actually compile at that version with
# both default and --all-features.
rust-version = "1.88.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/ZirekHQ/dengjen-tts"
homepage = "https://github.com/ZirekHQ/dengjen-tts"




[workspace.dependencies]
dengjen-tts-core = { path = "crates/dengjen/core", version = "2.1.0" }
dengjen-tts = { path = "crates/dengjen/synth", version = "2.1.0" }
dengjen-tts-piper = { path = "crates/dengjen/models/piper", version = "2.1.0" }
dengjen-tts-kokoro = { path = "crates/dengjen/models/kokoro", version = "2.1.0", default-features = false }
dengjen-tts-melotts = { path = "crates/dengjen/models/melotts", version = "2.1.0", default-features = false }
dengjen-espeak-phonemizer = { path = "crates/text/espeak-phonemizer", version = "2.1.0" }
dengjen-hebrew-phonemizer = { path = "crates/text/hebrew-phonemizer", version = "2.1.0" }
dengjen-pinyin-phonemizer = { path = "crates/text/pinyin-phonemizer", version = "2.1.0" }
dengjen-sonic-sys = { path = "crates/audio/sonic-sys", version = "2.1.0" }
dengjen-audio-ops = { path = "crates/audio/ops", version = "2.1.0" }
tracing = "0.1"
tracing-test = { version = "0.2", features = ["no-env-filter"] }






[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
